const ADMIN_ACTS = new Set(['lic-types','bk-new','bk-item','bk-set','bk-rm','bk-cancel','bk-done','bim-apply','bp-apply','undo-imp','wipe-all','new-emp','edit-emp','del-emp','new-tr','edit-tr','renew','del-tr','bulk','bulk-all','send-now','del-dept','del-type','pick-photo','imp-apply','del-admin']);
const denied = () => { toast('Танд засах эрх алга. Админтай холбогдоно уу.','bad'); };
document.addEventListener('click', ev => { const a = ev.target.closest('[data-act]'); if(!a) return; if(!S.admin && ADMIN_ACTS.has(a.dataset.act)){ ev.preventDefault(); return denied(); } const f = ACT[a.dataset.act]; if(f){ if(a.tagName === 'A') ev.preventDefault(); f(a, ev); } });
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && $('#modal-root').innerHTML && !$('#confirm-root').innerHTML) closeModal();
  if(ev.key === 'Enter' && ev.target.matches('.drow')) ev.target.click();
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.av-pick')){ ev.preventDefault(); ev.stopPropagation(); ACT['pick-photo'](ev.target); }
});
document.addEventListener('dragover', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(c && ev.dataTransfer?.types.includes('Files')){ ev.preventDefault(); $$('.photo-over').forEach(x => x !== c && x.classList.remove('photo-over')); c.classList.add('photo-over'); } });
document.addEventListener('dragleave', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(c && !c.contains(ev.relatedTarget)) c.classList.remove('photo-over'); });
document.addEventListener('drop', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(!c) return; ev.preventDefault(); if(!S.admin) return denied(); c.classList.remove('photo-over'); setPhoto(Number(c.dataset.photoDrop), ev.dataTransfer.files[0]); });
document.addEventListener('dragover', ev => { const z = ev.target.closest?.('[data-drop]'); if(!z) return; ev.preventDefault(); z.classList.add('over'); });
document.addEventListener('dragleave', ev => { const z = ev.target.closest?.('[data-drop]'); if(z && !z.contains(ev.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest?.('[data-drop]'); if(!z) return; ev.preventDefault(); if(!S.admin) return denied(); z.classList.remove('over'); const f = ev.dataTransfer.files[0]; if(f) startImport(f); });
function updBulkCount(){ const n = $$('.pick-list input:checked').length; const c = $('#b-count'); if(c) c.textContent = `${n} сонгосон`; }
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.dataset.filter){ const o = S[t.dataset.filter]; o[t.dataset.key] = t.type === 'checkbox' ? t.checked : t.value; $('#list').innerHTML = t.dataset.filter === 'ef' ? listEmps() : t.dataset.filter === 'lf' ? listLic() : listTrs(); }
  if(t.dataset.bv !== undefined && S.bv){ S.bv[t.dataset.bv] = t.value; if(t.dataset.bv === 'q'){ $('#bk-body').innerHTML = S.bv.view === 'due' ? bkDueView(dueList()) : S.bv.view === 'dept' ? bkDeptView(bkFiltered()) : S.bv.view === 'type' ? bkTypeView(bkFiltered()) : bkDayView(bkFiltered()); } else render(); }
  if('bkt' in t.dataset){ const ch = new Set($$('#bk-pick input:checked').map(i => Number(i.value))); $('#bk-pick').innerHTML = bkPick(Number(t.value), ch); const q = $('#b-q'); if(q) q.dispatchEvent(new Event('input', { bubbles:true })); }
  if(t.dataset.bulk){ const q = $('#b-q').value.trim().toLowerCase(), d = $('#b-dept').value; $$('.pick-list label').forEach(l => l.hidden = (d && l.dataset.dept !== d) || (q && !l.dataset.s.includes(q))); }
  const form = t.form;
  if(form && (form.dataset.form === 'training' || form.dataset.form === 'bulk') && (t.name === 'training_type_id' || t.name === 'completed_on') && form.completed_on.value){
    const m = Number(form.training_type_id.selectedOptions[0]?.dataset.m || 12); form.expires_on.value = addMonths(form.completed_on.value, m);
  }
  if(t.name === 'emp') updBulkCount();
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if(!S.admin && (t.dataset.photo || t.dataset.import || t.dataset.edit || 'bulkphoto' in t.dataset || 'bookimport' in t.dataset)){ t.value = ''; return denied(); }
  if(t.dataset.photo && t.files[0]){ const id = Number(t.dataset.photo); await run(async () => { await uploadPhoto(id, t.files[0]); refresh(); }, 'Зураг хадгалагдлаа'); }
  if(t.dataset.import && t.files[0]){ const f = t.files[0]; t.value = ''; startImport(f); }
  if('bookimport' in t.dataset && t.files[0]){ const f = t.files[0]; t.value = ''; openModal({ title:'Файл уншиж байна', body:'<div style="display:grid;place-items:center;padding:24px"><div class="spinner"></div></div>' }); startBookImport(f); }
  if(t.dataset.bim !== undefined && S.bim){ t.checked ? S.bim.pick.add(t.dataset.bim) : S.bim.pick.delete(t.dataset.bim); renderBookImport(); }
  if('bimDel' in t.dataset && S.bim){ S.bim.delMissing = t.checked; renderBookImport(); }
  if('bulkphoto' in t.dataset && t.files.length){ const fs = [...t.files]; t.value = ''; startBulkPhotos(fs); }
  if(t.dataset.bp === 'overwrite' && S.bp){ S.bp.overwrite = t.checked; renderBulkPhotos(); }
  if(t.dataset.imp && S.imp){
    const k = t.dataset.imp;
    if(k === 'sheet'){ S.imp.si = Number(t.value); S.imp.mode = null; parseCurrent(); }
    if(k === 'mode') S.imp.mode = t.value;
    if(k === 'addNew') S.imp.addNew = t.checked;
    if(k === 'deactivate') S.imp.deactivate = t.checked;
    if(k === 'months'){ const v = Number(t.value); if(v > 0) S.imp.months[t.dataset.k] = v; }
    renderImport();
  }
  if(t.dataset.edit){
    const id = Number(t.dataset.id), v = t.value.trim();
    if(t.dataset.edit === 'dept' && v) await run(async () => { await dbUpdate('departments', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-name' && v) await run(async () => { await dbUpdate('training_types', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-months' && Number(v) > 0) await run(async () => { await dbUpdate('training_types', id, { validity_months:Number(v) }); }, 'Хадгалагдлаа. Шинэ бичлэгт хэрэглэгдэнэ');
  }
});
const FORMS = {
  login: async f => { const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.password.value });
    btn.disabled = false; if(error){ const m = error.message || ''; return toast(/confirm/i.test(m) ? 'Имэйл баталгаажаагүй байна. Supabase → Authentication → Users дээр Confirm email хийнэ үү.' : /invalid login|credentials/i.test(m) ? 'Имэйл эсвэл нууц үг буруу байна' : 'Нэвтэрч чадсангүй: ' + m, 'bad'); } S.user = data.user; await start(); },
  emp: async f => {
    const id = num(f.id.value);
    const row = { emp_code:f.emp_code.value.trim()||null, full_name:f.full_name.value.trim(), department_id:num(f.department_id.value), position:f.position.value.trim()||null, email:f.email.value.trim()||null, phone:f.phone.value.trim()||null, active:f.active.checked,
      manager_id:num(f.manager_id.value), hired_on:f.hired_on.value||null, notes:f.notes.value.trim()||null, ...(S.extra && f.roster ? { roster:f.roster.value.trim()||null, poi:f.poi.value.trim()||null } : {}) };
    if(id && row.manager_id && (row.manager_id === id || isUnder(row.manager_id, id))) return toast('Өөрийн доод ажилтныг удирдлага болгож болохгүй','bad');
    const r = await run(() => id ? dbUpdate('employees', id, row) : dbInsert('employees', row), id ? 'Хадгалагдлаа' : 'Ажилтан нэмэгдлээ');
    if(r){ render(); openProfile(r.id); }
  },
  training: async f => {
    const id = num(f.id.value), emp = Number(f.employee_id.value);
    if(f.expires_on.value < f.completed_on.value) return toast('Дуусах огноо хамрагдсан огнооноос өмнө байна','bad');
    const row = { employee_id:emp, training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, certificate_no:f.certificate_no.value.trim()||null, provider:f.provider.value.trim()||null, notes:f.notes.value.trim()||null };
    const r = await run(() => id ? dbUpdate('trainings', id, row) : dbInsert('trainings', row), 'Сургалт хадгалагдлаа');
    if(r){ render(); openProfile(emp); }
  },
  bulk: async f => {
    const ids = $$('input[name=emp]:checked', f).map(i => Number(i.value)); if(!ids.length) return toast('Ажилтан сонгоно уу','bad');
    const base = { training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, provider:f.provider.value.trim()||null };
    const r = await run(() => dbInsert('trainings', ids.map(e => ({ ...base, employee_id:e }))), `${ids.length} ажилтанд бүртгэлээ`);
    if(r){ closeModal(); render(); }
  },
  settings: async f => {
    const days = [...new Set(f.days.value.split(/[,\s]+/).map(Number).filter(n => Number.isInteger(n) && n >= 0))].sort((a,b) => b-a);
    if(!days.length) return toast('Дор хаяж нэг хоног оруулна уу','bad');
    const r = await run(() => saveSettings({ reminder_days:days, hr_email:f.hr_email.value.trim()||null, from_email:f.from_email.value.trim(), company_name:f.company_name.value.trim(), ...('hide_expired_days' in S.settings || DEMO ? { hide_expired_days:Math.max(0, Number(f.hide_days.value)||0) } : {}) }), 'Тохиргоо хадгалагдлаа');
    render();
  },
  'add-dept': async f => { const n = f.name.value.trim(); await run(async () => { await dbInsert('departments', { name:n, sort:S.depts.length+1 }); render(); }, 'Алба нэмэгдлээ'); },
  'org-node': async f => { const id = Number(f.id.value);
    const r = await run(async () => { await dbUpdate('org_nodes', id, { title:f.title.value.trim() || null }); await orgAssign(id, num(f.employee_id.value), false); return true; }, 'Хадгалагдлаа');
    if(r){ closeModal(); render(); } },
  booking: async f => {
    const ids = $$('input[name=emp]:checked', f).map(i => Number(i.value)); if(!ids.length) return toast('Ажилтан сонгоно уу','bad');
    const t = IDX.type.get(Number(f.training_type_id.value)), d = f.start_on.value;
    const rows = ids.map(id => { const e = IDX.emp.get(id); return { month:d.slice(0,7), employee_id:id, emp_code:e.emp_code, full_name:e.full_name, dept_name:deptName(e.department_id), position:e.position,
      training_type_id:t.id, training_name:t.name, start_on:d, end_on:d, start_time:f.start_time.value || null, end_time:f.end_time.value || null, location:f.location.value.trim() || null, room:f.room.value.trim() || null, process:'Booked', status:'planned' }; });
    const r = await run(() => dbInsert('booking_items', rows), `${rows.length} хүнийг захиаллаа`); if(r){ closeModal(); S.view = 'book'; S.bv = { ...(S.bv || {}), month:d.slice(0,7), view:'day', dept:'', status:'', q:'' }; render(); } },
  'bk-done': async f => {
    const all = f.ids.value.split(',').map(Number).map(id => S.bitems.find(x => x.id === id)).filter(Boolean), on = new Set($$('input[name=bi]:checked', f).map(i => Number(i.value))), d = f.completed_on.value;
    const r = await run(async () => { const yes = all.filter(x => on.has(x.id)); const n = await bkMakeTrainings(yes, d);
      for(const x of all) await dbUpdate('booking_items', x.id, { status:on.has(x.id) ? 'done' : 'noshow' }); return n; }, n => `${on.size} хүн явагдсан, ${n} сургалтын бичлэг үүслээ`);
    if(r != null){ closeModal(); render(); } },
  'lic-types': async f => { if(!S.hasLicFlag) return toast('Эхлээд setup.sql-ийг Supabase дээр ажиллуулна уу','bad');
    const on = new Set($$('input[name=lic]:checked', f).map(i => Number(i.value)));
    const r = await run(async () => { for(const t of S.types){ const v = on.has(t.id); if(isLic(t) !== v || t.is_license == null) await dbUpdate('training_types', t.id, { is_license:v }); } return true; }, 'Хадгалагдлаа'); if(r){ closeModal(); render(); } },
  'add-admin': async f => { const em = f.email.value.trim().toLowerCase(); if(S.admins.some(a => a.email === em)) return toast('Аль хэдийн админ байна','bad');
    await run(async () => { let row = { email:em }; if(!DEMO){ const { data, error } = await sb.from('app_admins').insert(row).select().single(); if(error) throw error; row = data; } S.admins.push(row); render(); }, 'Админ нэмэгдлээ'); },
  'add-type': async f => { const n = f.name.value.trim(), m = Number(f.months.value)||12; await run(async () => { await dbInsert('training_types', { name:n, validity_months:m }); render(); }, 'Сургалт нэмэгдлээ'); }
};
document.addEventListener('submit', ev => { const f = ev.target; if(!f.dataset.form) return; ev.preventDefault(); if(!S.admin && !['login','org-node'].includes(f.dataset.form)) return denied(); FORMS[f.dataset.form]?.(f); });

/* ---------- boot ---------- */
async function start(){
  S.ready = false; S.auth = null; render();
  try{ await loadAll(); reindex(); S.ready = true; render(); }
  catch(e){ console.error(e); $('#app').innerHTML = `<div class="login"><div class="panel"><div class="panel-body"><h2 style="font-size:16px">Өгөгдөл ачаалж чадсангүй</h2><p class="muted">${esc(e.message||e)}</p><p class="note">setup.sql-ийг Supabase дээр ажиллуулсан эсэх, CONFIG дахь URL, түлхүүр зөв эсэхийг шалгана уу.</p></div></div></div>`; }
}
async function boot(){
  if(DEMO) return start();
  if(!sb){ $('#app').innerHTML = '<div class="login"><p>Supabase сан ачаалагдсангүй. Интернэт холболтоо шалгана уу.</p></div>'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ S.auth = 'login'; render(); return; }
  S.user = session.user; start();
}
boot();
</script>
</body>
