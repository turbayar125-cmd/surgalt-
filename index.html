<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сургалтын бүртгэл · Premium</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Layout: fixed left rail of sections + one working column; collapses to a top tab bar on phones */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eceff5; --line:#d9dee8; --line-2:#e8ebf2;
  --fg:#172033; --muted:#5a6479; --faint:#8a93a6;
  --accent:#1c4e8f; --accent-hover:#163f75; --accent-fg:#ffffff; --accent-soft:#e2eaf6;
  --ok:#1d7347; --ok-soft:#dff1e6; --warn:#9a5800; --warn-soft:#fcecd2;
  --bad:#b0242b; --bad-soft:#fbe1e1; --none:#6b7385; --none-soft:#eceef2;
  --av-l:86%; --av-fl:30%;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.10);
  --ovl:rgba(15,22,36,.45);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* shell — dark sidebar in both themes */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{--s-bg:#131a29;--s-fg:#e8ecf4;--s-muted:#97a2b8;--s-hover:#1e2739;--s-act:#2a3a58;--s-act-fg:#ffffff;--s-line:#222c40;
  background:var(--s-bg);color:var(--s-fg);border-right:1px solid var(--s-line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
:root[data-theme="dark"] .side{--s-bg:#0b1019;--s-hover:#161d2b;--s-act:#22314b;--s-line:#1b2333}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side{--s-bg:#0b1019;--s-hover:#161d2b;--s-act:#22314b;--s-line:#1b2333}}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.side .brand-mark{background:#3d7be0;color:#fff}
.brand b{display:block;font-size:14px;line-height:1.2}
/* Байгууллагын лого */
.side .brand{flex-direction:column;align-items:flex-start;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--s-line)}
.brand-logo{height:30px;width:auto;display:block;align-self:flex-start;object-fit:contain}
.brand-app{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--s-muted)}
.brand-app::before{content:"";width:3px;height:14px;border-radius:2px;background:#f5000a}
.brand-mark-img{display:none;height:28px;width:auto}
.nav button[aria-current="page"]{box-shadow:inset 3px 0 0 #f5000a}
.login-logo{height:30px;width:auto;align-self:flex-start;object-fit:contain}
.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block}}
.brand small{color:var(--muted);font-size:12px}
.side .brand small{color:var(--s-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--s-muted);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--s-hover);color:var(--s-fg)}
.nav button[aria-current="page"]{background:var(--s-act);color:var(--s-act-fg)}
.nav button:focus-visible{outline-color:#8fb4f0}
.nav svg{flex:none}
.nav .badge{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:12px;color:var(--s-muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.side-foot .btn-link{color:#8fb4f0}
.logout{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--s-line);background:var(--s-hover);color:var(--s-fg);border-radius:7px;padding:8px 10px;cursor:pointer;font-weight:500;font-size:13px;width:100%}
.logout:hover{background:#3a2430;border-color:#6b3040;color:#ffd6dc}
.who-email{overflow-wrap:anywhere}
.imp-list{display:flex;flex-direction:column}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.imp-row:last-child{border-bottom:0}
.imp-row.undone{opacity:.55}
.imp-row .p-sub{display:block}
.danger-zone{border:1px solid var(--bad-soft);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:861px){.main{padding-left:32px;padding-right:32px}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));gap:12px;border-right:0;border-bottom:1px solid var(--s-line);overflow-x:auto}
  .brand div,.brand-logo,.brand-app{display:none}
  .side .brand{padding:0;border:0}
  .brand-mark-img{display:block}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 #f5000a}
  .nav{flex-direction:row}
  .nav button span.lbl{font-size:13px}
  .side-foot{display:flex;margin:0 0 0 auto;flex-direction:row;align-items:center;padding:0 0 0 8px;position:sticky;right:0;background:var(--s-bg);box-shadow:-10px 0 10px var(--s-bg)}
  .side-foot .role,.side-foot .who-email{display:none}
  .logout{width:auto;padding:7px 9px;white-space:nowrap}
  .logout .lbl{display:none}
}

.demo-bar{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.demo-bar b{font-weight:600}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--bad)}
.btn-danger:hover{border-color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-s{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;flex:1 1 160px}
.toolbar .search{flex:2 1 220px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h2{font-size:15px;font-weight:600}
.panel-body{padding:16px 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile:hover{border-color:var(--faint)}
.tile .t-lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .t-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tile .t-sub{font-size:12px;color:var(--faint)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,transparent)}
.tile.ok{--tc:var(--ok)} .tile.warn{--tc:var(--warn)} .tile.bad{--tc:var(--bad)}
.tile.warn .t-num{color:var(--warn)} .tile.bad .t-num{color:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-none{background:var(--none-soft);color:var(--none)}
.chip-plain{background:var(--surface-2);color:var(--muted)}
.chip-acc{background:var(--accent-soft);color:var(--accent)}
.bk-list{display:flex;flex-direction:column;gap:10px}
.bk-days{display:flex;flex-direction:column;gap:14px}
#bk-body{display:flex;flex-direction:column;gap:12px}
.due-g summary{list-style:none} .due-g summary::-webkit-details-marker{display:none}
.due-g summary h2::before{content:"▸ ";color:var(--faint)} .due-g[open] summary h2::before{content:"▾ "}
.due-g .bk-ppl{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.due-g .bk-p .chip{margin-left:auto;flex:none}
.badge-n{display:inline-block;margin-left:4px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}
.bk-day.past{opacity:.82} .bk-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bk-dh{display:flex;gap:12px;align-items:center}
.bk-dh .bk-date{width:52px;padding:5px 0;grid-row:auto}
.bk-sess{display:flex;flex-direction:column;gap:12px}
.bk-s{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--surface)}
.bk-sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.bk-ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.bk-p{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:9px;padding:5px 8px;background:var(--surface);position:relative;min-width:0;cursor:pointer}
.bk-p:hover{border-color:var(--accent)}
.bk-p.cancelled,.bk-p.noshow{opacity:.55} .bk-p.cancelled .bk-pn b{text-decoration:line-through}
.bk-pn{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bk-pn b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-pn small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-st{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto} .bk-st.st-ok{background:var(--ok)} .bk-st.st-bad{background:var(--bad)} .bk-st.st-none{background:var(--none)}
.bk-x{margin-left:auto;border:0;background:none;color:var(--faint);cursor:pointer;border-radius:5px;padding:0 4px;font-size:14px}
.bk-x:hover{background:var(--surface-2);color:var(--fg)} .bk-st + .bk-x{margin-left:2px}
.bk-mx th,.bk-mx td{padding:7px 6px;font-size:12.5px} .bk-mx th:first-child,.bk-mx td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-left:12px}
.hm{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;background:rgb(47 95 179 / var(--a));color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.bk-date{width:58px;border-radius:10px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:6px 0;line-height:1.1;grid-row:span 2}
.bk-date b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.bk-date span{font-size:11px;font-weight:600}
.bk.done .bk-date{background:var(--ok-soft);color:var(--ok)} .bk.cancelled{opacity:.6} .bk.cancelled .bk-date{background:var(--none-soft);color:var(--none)}
.bk-title{font-weight:600;font-size:15px}
.bk-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.bk-act{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.due-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.due-row:last-child{border-bottom:0}
.lic-types{display:flex;flex-wrap:wrap;gap:8px}
.lic-type{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:150px}
.lic-type:hover,.lic-type.on{border-color:var(--accent)} .lic-type.on{background:var(--accent-soft)}
.lic-type b{font-size:13px} .lic-type span{font-size:12px;color:var(--muted)}
@media (max-width:640px){.bk{grid-template-columns:auto minmax(0,1fr)} .bk>.chip{grid-column:2}}
.chip-plain::before{display:none}

/* avatar */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--surface-2)}
.av-ini{background:hsl(var(--h) 42% var(--av-l));color:hsl(var(--h) 45% var(--av-fl));font-weight:600}
.av-sm{width:30px;height:30px;font-size:11px}
.av-md{width:40px;height:40px;font-size:14px}
.av-lg{width:56px;height:56px;font-size:18px}
.av-xl{width:112px;height:112px;font-size:34px}
.av-pick{position:relative;display:inline-grid;border-radius:50%;cursor:pointer;flex:none}
.av-cam{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;border:2px solid var(--surface);opacity:0;transition:opacity .15s}
.av-pick.no-photo .av-cam{opacity:.85}
.av-pick:hover .av-cam,.av-pick:focus-visible .av-cam{opacity:1}
.av-pick:hover .av{filter:brightness(.92)}
.av-pick.busy .av{opacity:.4}
.av-sm + .av-cam,.av-pick .av-sm ~ .av-cam{width:16px;height:16px;right:-4px;bottom:-4px}
@media (hover:none){.av-cam{opacity:1}}
.photo-over{outline:2px dashed var(--accent);outline-offset:2px}
/* Харах эрхтэй хэрэглэгчид засах товчнуудыг нууна */
body.ro [data-act="new-emp"],body.ro [data-act="edit-emp"],body.ro [data-act="del-emp"],body.ro [data-act="new-tr"],body.ro [data-act="edit-tr"],
body.ro [data-act="del-tr"],body.ro [data-act="renew"],body.ro [data-act="bulk"],body.ro [data-act="send-now"],body.ro [data-act="del-dept"],
body.ro [data-act="del-type"],body.ro [data-act="del-admin"],body.ro label:has(> input[data-import]),body.ro label:has(> input[data-bulkphoto]),body.ro label:has(> input[data-bookimport]),body.ro label:has(> input[data-photo]),
body.ro .tbl td.num:has([data-act="renew"]),body.ro .tr-act,body.ro .drop,body.ro .prof-top .actions{display:none!important}
.role{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;align-self:flex-start}
.role.adm{background:#2a3a58;color:#cfe0ff} .role.view{background:#22303a;color:#bfe3cf}
.ro-note{background:var(--surface-2);color:var(--muted);border-radius:var(--r);padding:9px 14px;font-size:13px}

/* dept bars */
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) 56px minmax(0,1.5fr) 46px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover .dname{color:var(--accent)}
.dname{font-weight:500;min-width:0;overflow-wrap:anywhere}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-bad{background:var(--bad)}
.pct{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}

<script>
/* ============================================================

const CONFIG = {
  SUPABASE_URL: 'https://gtzkbyencvvrfunfwxvn.supabase.co',

};

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const TABLES = { booking_items:'bitems', training_bookings:'books', departments:'depts', employees:'emps', training_types:'types', trainings:'trs', reminder_log:'logs', org_nodes:'nodes' };
const S = {
  ready:false, auth:null, user:null, view:'dash',

  settings:{ reminder_days:[30,14,7,1,0], hr_email:'', from_email:'Сургалт <noreply@otpclicenses.mn>', company_name:'Манай байгууллага', last_import:null },
  ef:{ q:'', dept:'', status:'', inactive:false },

let IDX = {}; let DEMO_ID = 0;

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

function addMonths(s, n){ const d=parseYmd(s), day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+n, 1); const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); }

function normDate(v){
  v = String(v||'').trim(); if(!v) return null;
  let m = v.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function toast(msg, kind=''){ const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(), kind==='bad'?6000:3200); }
function errMsg(e){ const m = e?.message || String(e); if(e?.code==='23505') return 'Давхардсан утга байна (код эсвэл нэр өөр байх ёстой).'; if(/JWT|session/i.test(m)) return 'Нэвтрэлт дууссан байна. Дахин нэвтэрнэ үү.'; if(/row-level security|permission denied|Зөвхөн админ/i.test(m) || e?.code === '42501') return 'Танд засах эрх алга. Админтай холбогдоно уу.'; return 'Алдаа: '+m; }
async function run(fn, okMsg){ try{ const r = await fn(); if(okMsg) toast(typeof okMsg==='function'?okMsg(r):okMsg); return r; } catch(e){ console.error(e); toast(errMsg(e),'bad'); } }

const hideLimit = () => { const v = S.settings.hide_expired_days; return v == null || v === '' ? 500 : Number(v); };
const warnDays = () => { const d = S.settings.reminder_days || []; return d.length ? Math.max(...d) : 30; };
const statusOf = d => d < 0 ? 'bad' : d <= warnDays() ? 'warn' : 'ok';

function reindex(){
  IDX.dept = new Map(S.depts.map(d => [d.id, d]));
  IDX.emp  = new Map(S.emps.map(e => [e.id, e]));
  IDX.type = new Map(S.types.map(t => [t.id, t]));
  const cur = new Map();
  for(const t of S.trs){
    const k = t.employee_id+':'+t.training_type_id, p = cur.get(k);
    if(!p || t.expires_on > p.expires_on || (t.expires_on === p.expires_on && t.id > p.id)) cur.set(k, t);
  }
  IDX.currentIds = new Set();
  // Хэт удаан хэтэрсэн (жишээ нь 500+ хоног) бичлэгийг идэвхгүй гэж үзэж тооцоололд оруулахгүй; профайлын "Өмнөх бичлэг"-д үлдэнэ
  const lim = hideLimit(); IDX.hidden = 0;
  IDX.current = [...cur.values()].filter(t => IDX.emp.has(t.employee_id) && IDX.type.has(t.training_type_id)).map(t => ({ ...t, days:daysUntil(t.expires_on) }))
    .filter(t => { if(lim > 0 && t.days < -lim){ IDX.hidden++; return false; } return true; })
    .map(t => { IDX.currentIds.add(t.id); return { ...t, status: statusOf(t.days) }; });
  IDX.byEmp = new Map();
  for(const c of IDX.current){ if(!IDX.byEmp.has(c.employee_id)) IDX.byEmp.set(c.employee_id, []); IDX.byEmp.get(c.employee_id).push(c); }
}
function empStatus(id){ const l = IDX.byEmp.get(id) || []; if(!l.length) return 'none'; if(l.some(c=>c.status==='bad')) return 'bad'; if(l.some(c=>c.status==='warn')) return 'warn'; return 'ok'; }
const activeCurrent = () => IDX.current.filter(c => IDX.emp.get(c.employee_id).active);
const deptName = id => IDX.dept.get(id)?.name || '—';
const typeName = id => IDX.type.get(id)?.name || '—';

const sortedTypes = () => [...S.types].sort((a,b) => a.name.localeCompare(b.name,'mn'));

function pendingReminders(){
  const days = [...(S.settings.reminder_days||[])].sort((a,b)=>a-b);
  const out = [];
  for(const c of activeCurrent()){
    if(c.days < 0) continue;
    const b = days.find(d => d >= c.days); if(b == null) continue;
    if(S.logs.some(l => l.training_id === c.id && l.days_before === b)) continue;
    out.push({ ...c, bucket:b });
  }
  return out.sort((a,b)=>a.days-b.days);
}

async function restorePhotos(){
  if(DEMO || !S.admin) return 0;
  const latest = new Map();
  for(let off = 0; off < 20000; off += 1000){
    const { data, error } = await sb.storage.from('photos').list('', { limit:1000, offset:off, sortBy:{ column:'name', order:'asc' } });
    if(error){ console.warn('photos list:', error.message); break; }
    for(const f of data){ const m = /^code-([\w-]+?)-(\d{10,})\.jpg$/.exec(f.name); if(!m) continue; const p = latest.get(m[1]); if(!p || +m[2] > p.t) latest.set(m[1], { t:+m[2], name:f.name }); }
    if(data.length < 1000) break;
  }
  let n = 0;
  for(const e of S.emps){
    const f = latest.get(codeKey(e.emp_code)); if(!f) continue;
    const url = sb.storage.from('photos').getPublicUrl(f.name).data.publicUrl;
    if(e.photo_url) continue; // гараар солисон зургийг хөндөхгүй
    try{ await dbUpdate('employees', e.id, { photo_url:url }); n++; } catch(err){ console.warn(err); }
  }
  return n;
}

let ZIP_P = null;
const loadZip = () => window.JSZip ? Promise.resolve(window.JSZip) : (ZIP_P ||= new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = () => res(window.JSZip); sc.onerror = () => { ZIP_P = null; rej(new Error('ZIP уншигч ачаалагдсангүй. Интернэт холболтоо шалгана уу.')); }; document.head.appendChild(sc); }));
const IMG_RE = /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i;
async function collectImages(files){
  const out = [];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      const Z = await loadZip(); const z = await Z.loadAsync(f);
      for(const e of Object.values(z.files)) if(!e.dir && IMG_RE.test(e.name) && !/(^|\/)(__MACOSX|\.)/.test(e.name)){
        const ext = e.name.split('.').pop().toLowerCase(), type = ext === 'png' ? 'image/png' : ext === 'webp' ? 'image/webp' : 'image/jpeg';
        out.push({ name:e.name.split('/').pop(), blob:new Blob([await e.async('arraybuffer')], { type }) });
      }
    } else if(IMG_RE.test(f.name) || /^image\//.test(f.type)) out.push({ name:f.name, blob:f });
  }
  return out;
}
// Файлын нэрээр ажилтныг олно: "01009555.jpg", "1009555.jpg", "Amartuvshin Batzaya.jpg", "01009555 Amartuvshin.jpg"…
function matchPhoto(fname){
  const base = fname.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
  const digits = (base.match(/\d{4,}/) || [])[0];
  if(digits){ const d = digits.replace(/^0+/, ''); const e = S.emps.find(x => x.emp_code && String(x.emp_code).replace(/\D/g, '').replace(/^0+/, '') === d); if(e) return e; }
  const nm = cleanName(base.replace(/\d+/g, ' ').replace(/[-.]+/g, ' ').replace(/\s+/g, ' ').trim()); if(!nm) return null;
  const k = normKey(nm), w = nm.toLowerCase().split(' ').filter(Boolean);
  let c = S.emps.filter(x => normKey(x.full_name) === k);
  if(!c.length && w.length >= 2) c = S.emps.filter(x => { const xw = cleanName(x.full_name).toLowerCase().split(/\s+/); return w.every(t => xw.includes(t)); }); // үгийн дараалал өөр байсан ч
  if(c.length > 1) c = c.filter(x => x.active);
  return c.length === 1 ? c[0] : null;
}
async function startBulkPhotos(files){
  if(!files?.length) return;
  openModal({ title:'Зураг уншиж байна', body:'<div style="display:grid;place-items:center;padding:24px"><div class="spinner"></div></div>' });
  try{
    const imgs = await collectImages([...files]);
    if(!imgs.length) throw new Error('Зураг олдсонгүй (jpg, png эсвэл тэдгээрийг агуулсан zip сонгоно уу)');
    const matched = new Map(), miss = [], dup = [];
    for(const im of imgs){ const e = matchPhoto(im.name); if(!e){ miss.push(im.name); continue; } if(matched.has(e.id)) dup.push(im.name); matched.set(e.id, { e, ...im }); }
    S.bp = { list:[...matched.values()], miss, dup, overwrite:true };
    renderBulkPhotos();
  } catch(e){ console.error(e); closeModal(); toast(e.message || String(e), 'bad'); }
}

async function fetchAll(table){
  const out = []; const step = 1000;
  for(let from=0;;from+=step){
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from+step-1);
    if(error) throw error; out.push(...data); if(data.length < step) break;
  }
  return out;
}

async function dbInsert(table, rows){
  const arr = Array.isArray(rows) ? rows : [rows]; let out = [];
  if(DEMO){ out = arr.map(r => ({ ...r, id: ++DEMO_ID, created_at: new Date().toISOString() })); }
  else for(let i=0;i<arr.length;i+=500){ const { data, error } = await sb.from(table).insert(arr.slice(i,i+500)).select(); if(error) throw error; out.push(...data); }
  S[TABLES[table]].push(...out); reindex();
  return Array.isArray(rows) ? out : out[0];
}
async function dbUpdate(table, id, patch){
  const list = S[TABLES[table]]; const i = list.findIndex(x => x.id === id); let row;
  if(DEMO) row = { ...list[i], ...patch };
  else { const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single(); if(error) throw error; row = data; }
  if(i >= 0) list[i] = row; reindex(); return row;
}
async function dbDelete(table, id){
  if(!DEMO){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }
  const k = TABLES[table]; S[k] = S[k].filter(x => x.id !== id);
  if(table === 'employees'){ S.trs = S.trs.filter(t => t.employee_id !== id); S.emps.forEach(e => { if(e.manager_id === id) e.manager_id = null; }); S.nodes.forEach(n => { if(n.employee_id === id) n.employee_id = null; }); }
  if(table === 'departments') S.nodes = S.nodes.filter(n => n.department_id !== id);
  if(table === 'employees') S.bitems.forEach(b => { if(b.employee_id === id) b.employee_id = null; });
  if(table === 'training_types') S.trs = S.trs.filter(t => t.training_type_id !== id);
  if(table === 'departments') S.emps.forEach(e => { if(e.department_id === id) e.department_id = null; });
  if(table === 'trainings') S.logs = S.logs.filter(l => l.training_id !== id);
  reindex();
}
async function dbDeleteMany(table, ids){
  ids = [...new Set(ids)].filter(Boolean); if(!ids.length) return;
  if(!DEMO) for(let i = 0; i < ids.length; i += 200){ const { error } = await sb.from(table).delete().in('id', ids.slice(i, i + 200)); if(error) throw error; }
  const set = new Set(ids), k = TABLES[table]; S[k] = S[k].filter(x => !set.has(x.id));
  if(table === 'employees'){ S.trs = S.trs.filter(t => !set.has(t.employee_id)); S.emps.forEach(e => { if(set.has(e.manager_id)) e.manager_id = null; }); S.nodes.forEach(n => { if(set.has(n.employee_id)) n.employee_id = null; }); }
  if(table === 'departments') S.nodes = S.nodes.filter(n => !set.has(n.department_id));
  if(table === 'trainings') S.logs = S.logs.filter(l => !set.has(l.training_id));
  reindex();
}

function resizeImage(file, size=360){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height); const ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob:b, dataUrl:c.toDataURL('image/jpeg', .85) }) : rej(new Error('Зураг уншиж чадсангүй')), 'image/jpeg', .85);
    };
    img.onerror = () => rej(new Error('Зургийн формат танигдсангүй'));
    img.src = url;
  });
}
async function uploadPhoto(empId, file){
  const { blob, dataUrl } = await resizeImage(file);
  if(DEMO) return dbUpdate('employees', empId, { photo_url:dataUrl });
  const code = String(IDX.emp.get(empId)?.emp_code || '').replace(/[^\w-]/g, '');
  const path = `${code ? 'code-' + code : 'emp-' + empId}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false }); // нэр нь давтагдахгүй тул дарж бичих шаардлагагүй
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return dbUpdate('employees', empId, { photo_url:data.publicUrl });
}

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'u',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'y',ь:'i',э:'e',ю:'yu',я:'ya','-':''};

  const NEED = [[0,1,3],[0,1,4,3],[0,1,6],[0,1,6],[0,1,5],[0,1,2,3],[0,1],[0,1]];
  const OPT  = [[[2,.4],[5,.3]],[[5,.6],[2,.4]],[[2,.4],[3,.3]],[[2,.3]],[[2,.4]],[[6,.5]],[[2,.3]],[[2,.3]]];
  const FN = ['Батбаяр','Энхтуяа','Ганболд','Сарантуяа','Мөнхбат','Оюунчимэг','Төмөрбаатар','Нармандах','Болормаа','Эрдэнэбат','Ариунаа','Батцэцэг','Дашдорж','Анударь','Тэмүүлэн','Хонгорзул','Билгүүн','Номин','Мөнх-Эрдэнэ','Цэцэгмаа','Ганзориг','Солонго','Баярсайхан','Уянга','Отгонбаяр','Наранцэцэг','Пүрэвдорж','Мишээл','Жавхлан','Гэрэлмаа','Чингүүн','Алтанцэцэг','Энхжаргал','Сүхбат','Индра','Хулан','Бат-Очир','Сондор','Ундрах','Золбоо'];
  const LI = ['А','Б','Г','Д','Л','М','Н','О','П','С','Т','Х','Ц','Ч','Ж','Э'];
  S.depts = D.map(([n],i) => ({ id:nid(), name:n, sort:i+1 }));
  S.types = T.map(([n,m]) => ({ id:nid(), name:n, validity_months:m, description:'' }));
  S.emps = []; S.trs = []; S.logs = [];
  const used = new Set(); let k = 0, cert = 100;
  const mkEmp = (di, pos, mgr) => {
    k++; const fn = pick(FN), li = pick(LI);
    let mail = translit(li)+'.'+translit(fn); const base = mail; let j = 2; while(used.has(mail)) mail = base + (j++); used.add(mail);

      manager_id:mgr, hired_on:addDays(today, -Math.round(60 + R()*3600)), notes:'' };
    S.emps.push(e);
    const need = [...NEED[di], ...OPT[di].filter(([, p]) => R() < p).map(([t]) => t)];
    for(const ti of need){
      const [, m, pre, prov] = T[ti];
      const span = m * 30.4; const off = Math.round(R() * (span + 45));

    }

  };
  D.forEach(([, cnt, headPos, supPos, staffPos], di) => {

/* --- teams (Алба) / org chart --- */
function teamTree(deptId){
  const members = S.emps.filter(e => e.active && e.department_id === deptId);
  const inDept = new Set(members.map(e => e.id)), kids = new Map(), roots = [];
  for(const e of members){
    if(e.manager_id && e.manager_id !== e.id && inDept.has(e.manager_id)){ if(!kids.has(e.manager_id)) kids.set(e.manager_id, []); kids.get(e.manager_id).push(e); }
    else roots.push(e);
  }
  const size = new Map(), seen = new Set();
  const count = e => { if(seen.has(e.id)) return 0; seen.add(e.id); let n = 1; for(const c of kids.get(e.id)||[]) n += count(c); size.set(e.id, n); return n; };
  roots.forEach(count);
  members.filter(e => !seen.has(e.id)).forEach(e => { roots.push(e); count(e); }); // давталттай (A→B→A) холбоосыг тасална
  const ord = (a,b) => (size.get(b.id)||1) - (size.get(a.id)||1) || a.full_name.localeCompare(b.full_name,'mn');
  kids.forEach(l => l.sort(ord)); roots.sort(ord);
  return { members, kids, roots, size };
}
function teamStats(members){
  const ids = new Set(members.map(e => e.id)), c = { ok:0, warn:0, bad:0 };
  activeCurrent().forEach(x => { if(ids.has(x.employee_id)) c[x.status]++; });
  const tot = c.ok + c.warn + c.bad;
  return { c, tot, pct: tot ? Math.round(c.ok/tot*100) : 0, w: v => tot ? (v/tot*100).toFixed(1) : 0 };
}

const deptNodes = id => S.nodes.filter(n => n.department_id === id);
const nodeSort = (a, b) => (a.sort ?? 0) - (b.sort ?? 0) || a.id - b.id;
function kidsMap(id){ const K = new Map(); for(const n of deptNodes(id)){ const k = n.parent_id ?? 0; if(!K.has(k)) K.set(k, []); K.get(k).push(n); } K.forEach(l => l.sort(nodeSort)); return K; }
const placedIds = () => new Set(S.nodes.filter(n => n.employee_id).map(n => n.employee_id));
// Таны зурган дээрх загварууд. '' = нэргүй (ажилтан) хайрцаг
const CH = (...t) => t.reduceRight((acc, x) => [x, acc ? [acc] : []], null);
const ORG_TPL = {
  qaqc: [0,1].map(() => ['Superintendent', [['Supervisor', [CH('Control Engineer','Laborant','Technician'), CH('Control Engineer','Laborant','Technician')]]]]),
  bp:   [0,1].map(() => ['Superintendent', [['Senior Technology Engineer', [CH('Technology Engineer','',''), CH('Technology Engineer','','')]]]]),
  wh:   [0,1].map(() => CH('Superintendent','Stock Keeper','','')),
  cp:   [0,1].map(() => ['Superintendent', [CH('Shift Master','',''), CH('Shift Master','','')]]),
  hr:   [['HR Manager', [['HR Officer', []], ['HR Officer', []]]]],
  administration: [['Site Manager', [['Coordinator', []], ['Coordinator', []], ['Planner', []], ['Planner', []]]]],
  hse:  [0,1].map(() => ['Superintendent', [['HSE Advisor', []], ['HSE Advisor', []]]]),
  mt:   [['Manager', [['Senior Engineer', [['Deputy Engineer', [CH('Mechanic Engineer','',''), CH('Mechanic Engineer','','')]]]], ['Senior Engineer', [['Planning Engineer', [CH('Mechanic Engineer','',''), CH('Mechanic Engineer','','')]]]]]]]
};

function obox(n, edit, root){
  const e = n.employee_id && IDX.emp.get(n.employee_id), st = e ? empStatus(e.id) : '';
  const title = n.title?.trim();
  return `<div class="obox ${root ? 'root' : ''}" data-drop-node="${n.id}" ${edit ? `draggable="true" data-drag-node="${n.id}"` : ''}>
    <div class="ob-title ${title ? '' : 'blank'}" title="${esc(title || 'Ажилтан')}">${title ? esc(title) : 'Ажилтан'}</div>
    ${edit ? `<button class="ob-menu" data-act="org-edit" data-id="${n.id}" title="Засах" aria-label="Хайрцаг засах">•••</button>` : ''}
    ${e ? `<div class="ob-person" data-act="profile" data-id="${e.id}" ${edit ? `draggable="true" data-drag-emp="${e.id}" data-from="${n.id}"` : ''} title="${esc(e.full_name)} · ${esc(e.position||'')} · ${ST[st]}"><span class="ob-av">${avatar(e,'sm')}<i class="ob-dot st-${st}"></i></span><span class="on-txt"><span class="on-name">${esc(e.full_name)}</span><span class="on-pos">${esc(e.position||'—')}</span></span></div>`
       : edit ? `<button class="ob-empty" data-act="org-edit" data-id="${n.id}"><i>+</i>Хүн сонгох</button>` : `<span class="ob-empty"><i></i>Сул орон тоо</span>`}
  </div>`;
}
const addBtn = pid => `<button class="ob-add" data-act="org-add" data-parent="${pid}" data-drop-add="${pid}" title="Доор нь хайрцаг нэмэх (хүнийг энд чирч болно)" aria-label="Доор нь нэмэх">+</button>`;
function orgBranch(n, K, edit){
  const ch = K.get(n.id) || [], leaves = ch.filter(c => !(K.get(c.id) || []).length);
  let sub = '';
  if(!ch.length) sub = edit ? addBtn(n.id) : '';
  else if(leaves.length === ch.length && ch.length > 4) sub = `<div class="leaf-group">${ch.map(c => obox(c, edit)).join('')}${edit ? addBtn(n.id) : ''}</div>`;
  else sub = `<ul>${ch.map(c => orgBranch(c, K, edit)).join('')}</ul>`;
  return `<li>${obox(n, edit, !n.parent_id)}${sub}</li>`;
}
function orgChart(deptId, edit){
  const K = kidsMap(deptId), roots = K.get(0) || [];
  if(!roots.length) return '';
  return `<div class="org-chart"><div class="org-row">${roots.map(r => `<ul class="tree">${orgBranch(r, K, edit)}</ul>`).join('')}</div></div>`;
}

/* --- org: үйлдлүүд --- */
async function orgCreate(deptId, spec, parentId, sort){
  const [title, kids] = spec;
  const n = await dbInsert('org_nodes', { department_id:deptId, parent_id:parentId ?? null, title:title || null, sort:sort ?? 0 });
  for(const [i, k] of (kids || []).entries()) await orgCreate(deptId, k, n.id, i);
  return n;
}
const nextSort = (deptId, pid) => Math.max(-1, ...deptNodes(deptId).filter(n => (n.parent_id ?? null) === (pid ?? null)).map(n => n.sort ?? 0)) + 1;
async function orgAssign(nodeId, empId, swap){
  const target = S.nodes.find(n => n.id === nodeId); if(!target || target.employee_id === empId) return;
  const from = empId ? S.nodes.find(n => n.employee_id === empId) : null, prev = target.employee_id;
  if(from) await dbUpdate('org_nodes', from.id, { employee_id:null });
  if(prev && empId) await dbUpdate('org_nodes', nodeId, { employee_id:null });
  await dbUpdate('org_nodes', nodeId, { employee_id:empId || null });
  if(swap && from && prev) await dbUpdate('org_nodes', from.id, { employee_id:prev });
}
const isInside = (id, root) => { let n = S.nodes.find(x => x.id === id); const seen = new Set(); while(n && !seen.has(n.id)){ if(n.id === root) return true; seen.add(n.id); n = S.nodes.find(x => x.id === n.parent_id); } return false; };
async function orgMove(id, parentId){
  const n = S.nodes.find(x => x.id === id); if(!n || id === parentId || n.parent_id === parentId) return;
  if(parentId && isInside(parentId, id)) return toast('Хайрцгийг өөрийн доод хэсэг рүү зөөх боломжгүй', 'bad');
  await dbUpdate('org_nodes', id, { parent_id:parentId ?? null, sort:nextSort(n.department_id, parentId) });
}
async function orgDelete(id){
  const n = S.nodes.find(x => x.id === id); if(!n) return;
  const ch = S.nodes.filter(x => x.parent_id === id).sort(nodeSort); let s0 = nextSort(n.department_id, n.parent_id);
  for(const c of ch) await dbUpdate('org_nodes', c.id, { parent_id:n.parent_id ?? null, sort:s0++ }); // доорх хайрцгууд дээш шилжинэ
  await dbDelete('org_nodes', id);
}
function orgEditForm(n){
  const e = n.employee_id && IDX.emp.get(n.employee_id), placed = placedIds();
  const opt = x => `<option value="${x.id}" ${x.id === n.employee_id ? 'selected' : ''}>${esc(x.full_name)}${x.position ? ' — ' + esc(x.position) : ''}${placed.has(x.id) && x.id !== n.employee_id ? ' (өөр хайрцагт)' : ''}</option>`;
  const act = S.emps.filter(x => x.active).sort((a, b) => a.full_name.localeCompare(b.full_name));
  const mine = act.filter(x => x.department_id === n.department_id), free = mine.filter(x => !placed.has(x.id) || x.id === n.employee_id), busy = mine.filter(x => placed.has(x.id) && x.id !== n.employee_id), other = act.filter(x => x.department_id !== n.department_id);
  return `<form data-form="org-node" style="display:flex;flex-direction:column;gap:12px"><input type="hidden" name="id" value="${n.id}">
    <div class="field"><label for="on-title">Албан тушаал (хайрцгийн нэр)</label><input class="inp" id="on-title" name="title" value="${esc(n.title||'')}" placeholder="Жишээ нь: Shift Master. Хоосон бол 'Ажилтан'"></div>
    <div class="field"><label for="on-emp">Ажилтан</label><select class="inp" id="on-emp" name="employee_id"><option value="">— Сул орон тоо —</option>
      ${free.length ? `<optgroup label="${esc(deptName(n.department_id))} · байрлаагүй">${free.map(opt).join('')}</optgroup>` : ''}
      ${busy.length ? `<optgroup label="${esc(deptName(n.department_id))} · өөр хайрцагт байгаа (зөөгдөнө)">${busy.map(opt).join('')}</optgroup>` : ''}
      ${other.length ? `<optgroup label="Бусад алба">${other.map(opt).join('')}</optgroup>` : ''}</select></div>
    <div class="m-foot" style="justify-content:space-between"><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-danger" type="button" data-act="org-del" data-id="${n.id}">Хайрцгийг устгах</button><button class="btn" type="button" data-act="org-add" data-parent="${n.id}">+ Доор нь нэмэх</button></span>
      <span style="display:flex;gap:8px"><button class="btn" type="button" data-act="close">Болих</button><button class="btn btn-primary" type="submit">Хадгалах</button></span></div></form>`;
}
async function orgAuto(deptId){
  const placed = placedIds(), K = kidsMap(deptId), order = [], q = [...(K.get(0) || [])];
  while(q.length){ const n = q.shift(); order.push(n); q.push(...(K.get(n.id) || [])); }
  const pool = S.emps.filter(e => e.active && e.department_id === deptId && !placed.has(e.id));
  let c = 0;
  for(const n of order){
    if(n.employee_id || !n.title?.trim()) continue;
    const t = normKey(n.title), i = pool.findIndex(e => { const p = normKey(e.position || ''); return p && (p === t || p.includes(t) || t.includes(p)); });
    if(i < 0) continue; await dbUpdate('org_nodes', n.id, { employee_id:pool[i].id }); pool.splice(i, 1); c++;
  }
  return c;
}

/* drag & drop */
let DRAG = null;
document.addEventListener('dragstart', ev => {
  const p = ev.target.closest?.('[data-drag-emp]'), b = !p && ev.target.closest?.('[data-drag-node]');
  if(!p && !b) return;
  DRAG = p ? { type:'emp', emp:Number(p.dataset.dragEmp), from:p.dataset.from ? Number(p.dataset.from) : null } : { type:'node', id:Number(b.dataset.dragNode) };
  ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', JSON.stringify(DRAG)); } catch{}
  ev.stopPropagation();
});
document.addEventListener('dragend', () => { DRAG = null; $$('.drop-ok').forEach(x => x.classList.remove('drop-ok')); });
const dropTarget = el => el.closest?.('[data-drop-node],[data-drop-add]') || (DRAG?.type === 'emp' && DRAG.from ? el.closest?.('[data-drop-pool]') : null);
document.addEventListener('dragover', ev => { if(!DRAG) return; const t = dropTarget(ev.target); if(!t) return; ev.preventDefault(); $$('.drop-ok').forEach(x => x !== t && x.classList.remove('drop-ok')); t.classList.add('drop-ok'); });
document.addEventListener('drop', async ev => {
  if(!DRAG) return; const t = dropTarget(ev.target); if(!t) return; ev.preventDefault(); ev.stopPropagation();
  const d = DRAG; DRAG = null; t.classList.remove('drop-ok');
  await run(async () => {
    if(t.dataset.dropPool){ if(d.from) await dbUpdate('org_nodes', d.from, { employee_id:null }); }
    else if(t.dataset.dropAdd){ const pid = Number(t.dataset.dropAdd), p = S.nodes.find(n => n.id === pid);
      if(d.type === 'node') await orgMove(d.id, pid);
      else { const emp = IDX.emp.get(d.emp), from = S.nodes.find(n => n.employee_id === d.emp); if(from) await dbUpdate('org_nodes', from.id, { employee_id:null });
        await dbInsert('org_nodes', { department_id:p.department_id, parent_id:pid, title:emp?.position || null, employee_id:d.emp, sort:nextSort(p.department_id, pid) }); } }
    else { const nid = Number(t.dataset.dropNode); if(d.type === 'node') await orgMove(d.id, nid); else await orgAssign(nid, d.emp, true); }
  });
  render();
});

const BK = { planned:['Төлөвлөсөн','acc'], done:['Явагдсан','ok'], cancelled:['Цуцалсан','none'], noshow:['Ирээгүй','bad'] };
const WD = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
const MON = ['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
const monLabel = m => { const [y, mm] = String(m).split('-'); return mm ? `${y} оны ${MON[+mm - 1]}` : m; };
const biDept = b => { const e = b.employee_id && IDX.emp.get(b.employee_id); return (e && deptName(e.department_id) !== '—') ? deptName(e.department_id) : (matchDept(b.dept_name, new Map(S.depts.map(d => [normKey(d.name), d])))?.name || b.dept_name || '—'); };
const biName = b => { const e = b.employee_id && IDX.emp.get(b.employee_id); return e ? e.full_name : (b.full_name || '—'); };
const biType = b => b.training_type_id ? typeName(b.training_type_id) : (b.training_name || '—');
function dueList(){
  const today = todayStr(), booked = new Set(S.bitems.filter(b => b.status === 'planned' && (!b.start_on || b.start_on >= addDays(today, -7))).map(b => b.training_type_id + ':' + b.employee_id));
  const by = new Map();
  for(const c of activeCurrent()){ if(c.days > 60 || booked.has(c.training_type_id + ':' + c.employee_id)) continue;
    if(!by.has(c.training_type_id)) by.set(c.training_type_id, { bad:0, warn:0, ids:[] }); const g = by.get(c.training_type_id); g.ids.push(c.employee_id); c.days < 0 ? g.bad++ : g.warn++; }
  return [...by].map(([tid, g]) => ({ tid, ...g })).sort((a, b) => b.ids.length - a.ids.length);
}
function bkFiltered(){
  const v = S.bv, q = v.q.trim().toLowerCase();
  return S.bitems.filter(b => (!v.month || b.month === v.month) && (!v.dept || biDept(b) === v.dept) && (!v.status || b.status === v.status)
    && (!q || (biName(b) + ' ' + (b.emp_code||'') + ' ' + biType(b) + ' ' + (b.location||'')).toLowerCase().includes(q)));
}

function bkDueView(due){
  const v = S.bv, q = v.q.trim().toLowerCase();
  const cur = new Map(activeCurrent().map(c => [c.training_type_id + ':' + c.employee_id, c]));
  const groups = due.map(g => ({ ...g, ppl:g.ids.map(id => IDX.emp.get(id)).filter(e => e && (!v.dept || deptName(e.department_id) === v.dept) && (!q || (e.full_name + ' ' + (e.emp_code||'') + ' ' + typeName(g.tid)).toLowerCase().includes(q)))
    .sort((a, b) => cur.get(g.tid + ':' + a.id).days - cur.get(g.tid + ':' + b.id).days) })).filter(g => g.ppl.length);
  if(!groups.length) return '<div class="panel empty">Захиалга хэрэгтэй хүн алга. Бүгд хамрагдсан эсвэл захиалгад орсон байна.</div>';

  return `<p class="note" style="margin:0">Хугацаа нь дууссан эсвэл 60 хоногт дуусах, захиалгад ороогүй <b>${total}</b> тохиолдол · ${groups.length} сургалт</p>
  ${groups.map(g => { const bad = g.ppl.filter(e => cur.get(g.tid + ':' + e.id).days < 0).length, warn = g.ppl.length - bad;
    return `<section class="panel"><details class="due-g"><summary class="panel-head" style="cursor:pointer;border-bottom:0"><span style="min-width:0"><h2>${esc(typeName(g.tid))}</h2><span class="p-sub">${bad ? `<span style="color:var(--bad)">${bad} дууссан</span>` : ''}${bad && warn ? ' · ' : ''}${warn ? `<span style="color:var(--warn)">${warn} дуусах дөхсөн</span>` : ''}</span></span>
      <span class="chips-row" style="align-items:center">${deptChips(g.ppl.map(e => ({ employee_id:e.id })))}<span class="chip chip-acc">${g.ppl.length} хүн</span>${S.admin ? `<button class="btn btn-sm btn-primary" data-act="bk-new" data-type="${g.tid}" data-ids="${g.ppl.map(e => e.id).join(',')}">Захиалах</button>` : ''}</span></summary>
      <div class="panel-body" style="border-top:1px solid var(--line-2)"><div class="bk-ppl">${g.ppl.map(e => { const c = cur.get(g.tid + ':' + e.id);
        return `<span class="bk-p" data-act="profile" data-id="${e.id}" title="${esc(e.position||'')}">${avatar(e,'sm')}<span class="bk-pn"><b>${esc(e.full_name)}</b><small>${esc(deptName(e.department_id))} · ${esc(e.position||'')}</small></span>${chip(c.status, c.days < 0 ? `${-c.days} хоног хэтэрсэн` : `${c.days} хоног`)}</span>`; }).join('')}</div></div></details></section>`; }).join('')}`;
}
const bookImportBtn = (label = 'Захиалгын Excel', cls = 'btn') => `<label class="${cls}" style="cursor:pointer">${label}<input type="file" accept=".xlsx,.xls,.xlsm" data-bookimport hidden></label>`;
const timeSpan = b => b.start_time ? `${b.start_time}${b.end_time ? '–' + b.end_time : ''}` : '';
function bkGroups(list){ // нэг сургалт, нэг цаг, нэг газар = нэг хичээл

const MONTHS_EN = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const isBookSheet = sh => sh.rows.slice(0, 5).some(r => { const h = r.map(normKey); return h.some(x => x.includes('сургалт') && x.includes('нэр')) && h.some(x => x.includes('эхлэх')); });
const cellTime = v => { if(v == null || v === '') return ''; if(typeof v === 'number'){ const m = Math.round((v % 1) * 1440); return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; } const m = String(v).match(/(\d{1,2})[:.](\d{2})/); return m ? `${m[1].padStart(2,'0')}:${m[2]}` : cellStr(v); };
const BK_MAP = v => { const k = normKey(v); if(!k) return 'planned'; if(/complet|явагдсан|дууссан/.test(k)) return 'done'; if(/cancel|цуцал/.test(k)) return 'cancelled'; if(/notattend|ирээгүй|noshow/.test(k)) return 'noshow'; return 'planned'; };
function parseBookSheet(sh){

  if(hi < 0) return null;
  const H = sh.rows[hi].map(x => cellStr(x).toLowerCase());
  const find = (re, from = 0) => H.findIndex((x, i) => i >= from && re.test(x));
  const c = { dept:find(/^алба/), pos:find(/албан\s*тушаал/), code:find(/^(сап|sap|код|employee\s*id)/), name:find(/овог|нэр$/), tr:find(/сургалтын\s*нэр|program|training/),
    start:find(/эхлэх\s*өдөр|start\s*date/), end:find(/дуусах\s*өдөр|end\s*date/), st:find(/эхлэх\s*цаг|start\s*time/), et:find(/дуусах\s*цаг|end\s*time/), loc:find(/байршил|location/),
    room:find(/анги|room/), proc:find(/захиалгын\s*процесс|process/), perf:find(/гүйцэтгэл|status/), teacher:find(/багш|teacher|trainer/), note:find(/тайлбар|note|comment/) };
  const trI = c.tr; c.kind = H.findIndex((x, i) => i > trI && /^төрөл$/.test(x)); if(c.kind < 0) c.kind = find(/^төрөл$/);
  const g = (r, k) => c[k] >= 0 ? r[c[k]] : '';
  const out = []; let lastDept = '', lastName = '', lastCode = '';
  for(const r of sh.rows.slice(hi + 1)){
    let name = cleanName(g(r, 'name')), code = cellStr(g(r, 'code')), dept = cellStr(g(r, 'dept'));
    if(dept) lastDept = dept; if(name){ if(name !== lastName) { lastName = name; } } if(code) lastCode = code;
    const tr = cellStr(g(r, 'tr')); if(!tr || !name) continue;
    const sd = cellDate(g(r, 'start')), rawStart = cellStr(g(r, 'start'));
    const perf = cellStr(g(r, 'perf')), err = /^#|missing/i.test(perf);
    out.push({ code, name, dept: dept || lastDept, pos:cellStr(g(r, 'pos')), tr, kind:cellStr(g(r, 'kind')), start_on:sd, end_on:cellDate(g(r, 'end')) || sd,
      start_time:cellTime(g(r, 'st')), end_time:cellTime(g(r, 'et')), location:cellStr(g(r, 'loc')).replace(/ /g, '').trim(), room:cellStr(g(r, 'room')),
      process:cellStr(g(r, 'proc')), status:BK_MAP(err ? '' : perf), teacher:cellStr(g(r, 'teacher')),
      note:[cellStr(g(r, 'note')), !sd && rawStart ? 'Огноо: ' + rawStart : '', err && /missing/i.test(perf) ? 'SAP дутуу' : ''].filter(Boolean).join(' · ') || null });
  }
  const ds = out.map(x => x.start_on).filter(Boolean).sort(), mi = MONTHS_EN.indexOf(sh.name.trim().toLowerCase());
  const year = ds.length ? ds[Math.floor(ds.length / 2)].slice(0, 4) : todayStr().slice(0, 4);
  const month = mi >= 0 ? `${year}-${String(mi + 1).padStart(2, '0')}` : (ds.length ? ds[Math.floor(ds.length / 2)].slice(0, 7) : sh.name);

}
function planBook(parsed){
  const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [codeK(e.emp_code), e]));
  const byName = new Map(); S.emps.forEach(e => nameKeys(e.full_name).forEach(k => { if(!byName.has(k)) byName.set(k, []); byName.get(k).push(e); }));
  const typeMap = new Map(S.types.map(t => [normKey(t.name), t]));
  const ex = new Map(S.bitems.filter(b => b.import_key).map(b => [b.import_key, b]));
  const out = { ins:[], upd:[], same:0, dups:0, del:[], unmatched:new Set(), unknownTypes:new Set(), months:new Set() }, seen = new Set();
  for(const P of parsed){
    out.months.add(P.month);
    for(const r of P.rows){
      let e = r.code && byCode.get(codeK(r.code)); if(!e){ for(const k of nameKeys(r.name)){ const c = byName.get(k) || []; if(c.length === 1){ e = c[0]; break; } } }
      if(!e) out.unmatched.add(r.name);
      const t = typeMap.get(normKey(r.tr)); if(!t) out.unknownTypes.add(r.tr);
      const key = [P.month, codeK(r.code) || normKey(r.name), normKey(r.tr), r.start_on || 'x'].join('|'); if(seen.has(key)){ out.dups++; continue; } seen.add(key);
      const row = { month:P.month, sheet:P.sheet, employee_id:e?.id ?? null, emp_code:r.code || e?.emp_code || null, full_name:r.name, dept_name:r.dept || null, position:r.pos || null,
        training_type_id:t?.id ?? null, training_name:r.tr, kind:r.kind || null, start_on:r.start_on, end_on:r.end_on, start_time:r.start_time || null, end_time:r.end_time || null,
        location:r.location || null, room:r.room || null, process:r.process || null, status:r.status, teacher:r.teacher || null, note:r.note, import_key:key };
      const old = ex.get(key);
      if(!old) out.ins.push(row);
      else { const patch = {}; for(const k of Object.keys(row)) if(String(row[k] ?? '') !== String(old[k] ?? '')) patch[k] = row[k];
        if(old.status !== 'planned' && row.status === 'planned') delete patch.status; // гараар тэмдэглэсэн төлвийг хадгална
        if(Object.keys(patch).length) out.upd.push({ id:old.id, patch }); else out.same++; }
    }
  }
  out.del = S.bitems.filter(b => b.import_key && out.months.has(b.month) && !seen.has(b.import_key) && b.status === 'planned').map(b => b.id);
  return out;
}

async function applyBookImport(){

const VIEWS = { dash:viewDash, org:viewOrg, emps:viewEmps, trs:viewTrs, book:viewBook, lic:viewLic, settings:viewSettings };

/* ---------- modals ---------- */
function openModal({ title, body, wide=false, drawer=false }){
  $('#modal-root').innerHTML = `<div class="ovl ${drawer?'is-drawer':''}" data-act="ovl"><div class="${drawer?'drawer':'modal'+(wide?' wide':'')}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header class="m-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Хаах">×</button></header><div class="m-body">${body}</div></div></div>`;
  const first = $('#modal-root .m-body input:not([type=hidden]):not([type=file]), #modal-root .m-body select'); if(first && !drawer) first.focus();
}
function closeModal(){ $('#modal-root').innerHTML = ''; S.openEmp = null; S.imp = null; S.bp = null; S.bim = null; }
function askConfirm(msg, okLabel='Устгах'){
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="ovl"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:420px"><div class="m-body"><p style="margin:0">${esc(msg)}</p>
      <div class="m-foot"><button class="btn" data-c="0">Болих</button><button class="btn btn-primary" data-c="1">${esc(okLabel)}</button></div></div></div></div>`;
    root.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { root.innerHTML = ''; res(b.dataset.c === '1'); });
    root.querySelector('[data-c="1"]').focus();
  });
}
function refresh(){ render(); if(S.openEmp && $('.drawer')){ $('.drawer .m-body').innerHTML = profileBody(S.openEmp); } }

function profileBody(id){
  const e = IDX.emp.get(id); if(!e) return '<div class="empty">Ажилтан олдсонгүй.</div>';
  const cur = (IDX.byEmp.get(id)||[]).sort((a,b) => a.days - b.days);
  const old = S.trs.filter(t => t.employee_id === id && !IDX.currentIds.has(t.id)).sort((a,b) => b.expires_on.localeCompare(a.expires_on));
  const mgr = e.manager_id ? IDX.emp.get(e.manager_id) : null;
  const reps = S.emps.filter(x => x.manager_id === id && x.active).sort((a,b) => a.full_name.localeCompare(b.full_name,'mn'));
  return `<div class="prof-top"><div class="prof-photo" data-photo-drop="${id}">${avatarPick(e,'xl')}<label class="btn btn-sm">Зураг ${e.photo_url?'солих':'оруулах'}<input type="file" accept="image/*" data-photo="${id}" hidden></label></div>
    <div style="min-width:0"><h3>${esc(e.full_name)}</h3><p class="muted" style="margin:2px 0 0">${esc(e.position||'—')} · ${esc(deptName(e.department_id))}</p>
      <div style="margin-top:8px">${e.active ? chip(empStatus(id)) : chip('none','Ажлаас гарсан')}</div>
      <dl class="kv"><dt>Код</dt><dd class="mono">${esc(e.emp_code||'—')}</dd><dt>Имэйл</dt><dd>${e.email?`<a href="mailto:${esc(e.email)}">${esc(e.email)}</a>`:'—'}</dd><dt>Утас</dt><dd class="mono">${e.phone?`<a href="tel:${esc(e.phone)}">${esc(e.phone)}</a>`:'—'}</dd>
        ${e.roster ? `<dt>Ээлж</dt><dd>${esc(e.roster)}</dd>` : ''}${e.poi ? `<dt>Ажилд авсан газар (POI)</dt><dd>${esc(e.poi)}</dd>` : ''}
        <dt>Ажилд орсон</dt><dd>${e.hired_on ? `<span class="mono">${fmtDate(e.hired_on)}</span> <span class="muted">· ${tenure(e.hired_on)}</span>` : '—'}</dd>
        <dt>Шууд удирдлага</dt><dd>${mgr ? `<button class="pchip" data-act="profile" data-id="${mgr.id}">${avatar(mgr,'sm')}${esc(mgr.full_name)}</button> <span class="muted">${esc(mgr.position||'')}</span>` : '—'}</dd></dl>
      ${e.notes ? `<p class="note" style="margin-top:10px;white-space:pre-line">${esc(e.notes)}</p>` : ''}
      <div class="actions" style="margin-top:14px"><button class="btn btn-sm" data-act="edit-emp" data-id="${id}">Мэдээлэл засах</button><button class="btn btn-sm btn-danger" data-act="del-emp" data-id="${id}">Устгах</button></div></div></div>
  ${reps.length ? `<div><h4 style="font-size:14px;margin-bottom:8px">Шууд харьяалагдах (${reps.length})</h4><div class="chips-row">${reps.map(r => `<button class="pchip" data-act="profile" data-id="${r.id}">${avatar(r,'sm')}${esc(r.full_name)}</button>`).join('')}</div></div>` : ''}
  <div class="sec-head"><h4>Сургалтууд (${cur.length})</h4><button class="btn btn-sm btn-primary" data-act="new-tr" data-emp="${id}">+ Сургалт нэмэх</button></div>
  <div class="tr-list">${cur.length ? cur.map(c => trCard(c, true)).join('') : '<div class="empty">Сургалт бүртгэгдээгүй байна.</div>'}</div>
  ${old.length ? `<details class="hist"><summary>Өмнөх бичлэгүүд (${old.length})</summary><div class="tr-list" style="margin-top:8px">${old.map(t => trCard(t, false)).join('')}</div></details>` : ''}`;
}
function trCard(t, isCur){
  return `<div class="tr-card"><div style="min-width:0"><div class="tr-name">${esc(typeName(t.training_type_id))}</div>
    <div class="tr-meta"><span>Хамрагдсан <span class="mono">${fmtDate(t.completed_on)}</span></span><span>Дуусах <span class="mono">${fmtDate(t.expires_on)}</span></span>${t.certificate_no?`<span>№ <span class="mono">${esc(t.certificate_no)}</span></span>`:''}${t.provider?`<span>${esc(t.provider)}</span>`:''}</div>
    ${t.notes?`<div class="tr-meta">${esc(t.notes)}</div>`:''}</div>
    <div>${isCur ? chip(t.status, daysText(t.days)) : chip('plain','Өмнөх')}</div>
    <div class="tr-act">${isCur?`<button class="btn btn-sm" data-act="renew" data-id="${t.id}">Сунгах</button>`:''}<button class="btn btn-sm" data-act="edit-tr" data-id="${t.id}">Засах</button><button class="btn btn-sm btn-danger" data-act="del-tr" data-id="${t.id}">Устгах</button></div></div>`;
}
function tenure(d){ const m = Math.floor(-daysUntil(d) / 30.44); if(m < 0) return 'эхлээгүй'; const y = Math.floor(m/12), r = m % 12; return (y ? y+' жил ' : '') + (r || !y ? r+' сар' : '').trim(); }
function mgrOptions(e){
  const others = S.emps.filter(x => x.active && x.id !== e.id && !(e.id && isUnder(x.id, e.id)));
  const same = others.filter(x => x.department_id === e.department_id), rest = others.filter(x => x.department_id !== e.department_id);
  const opt = x => `<option value="${x.id}" ${e.manager_id===x.id?'selected':''}>${esc(x.full_name)}${x.position?' — '+esc(x.position):''}${x.department_id!==e.department_id?' · '+esc(deptName(x.department_id)):''}</option>`;
  const by = l => l.sort((a,b) => (S.emps.some(y => y.manager_id === b.id) - S.emps.some(y => y.manager_id === a.id)) || a.full_name.localeCompare(b.full_name,'mn'));
  return `<option value="">— Байхгүй (албаны дээд удирдлага) —</option>${same.length?`<optgroup label="${esc(deptName(e.department_id))}">${by(same).map(opt).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Бусад алба">${by(rest).map(opt).join('')}</optgroup>`:''}`;
}
// x нь root-ийн доор (шууд эсвэл шууд бус) байгаа эсэх — давталт үүсгэхээс сэргийлнэ
function isUnder(x, root){ const seen = new Set(); let cur = IDX.emp.get(x); while(cur && cur.manager_id && !seen.has(cur.id)){ if(cur.manager_id === root) return true; seen.add(cur.id); cur = IDX.emp.get(cur.manager_id); } return false; }

    <div class="grid2"><div class="field"><label for="f-mail">Имэйл (сануулга энд очно)</label><input class="inp" id="f-mail" name="email" type="email" value="${esc(e.email||'')}"></div>
      <div class="field"><label for="f-ph">Утас</label><input class="inp mono" id="f-ph" name="phone" value="${esc(e.phone||'')}"></div></div>
    <div class="grid2"><div class="field"><label for="f-mgr">Шууд удирдлага</label><select class="inp" id="f-mgr" name="manager_id">${mgrOptions(e)}</select></div>

function parseCSV(text){
  text = text.replace(/^﻿/, '');

  const delim = [';','\t',','].map(d => [d, first.split(d).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}

  const deptMap = new Map(S.depts.map(d => [normKey(d.name), d]));
  const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [codeK(e.emp_code), e]));
  const byName = new Map(); S.emps.forEach(e => nameKeys(e.full_name).forEach(k => { if(!byName.has(k)) byName.set(k, []); byName.get(k).push(e); }));
  const typeMap = new Map(S.types.map(t => [normKey(t.name), t]));
  const out = { empNew:[], empUpd:[], empSame:0, recNew:[], recSame:0, recOld:0, newTypes:[], newDepts:[], errors:[...P.errors], resolved:[], typeFix:[], deact:[], fromQual:0 };
  const Q = opt.qual, qMonths = tk => Q?.months.get(tk);
  const newKeys = new Map();
  P.emps.forEach((r, i) => {
    let e = r.code && byCode.get(codeK(r.code));
    if(!e){ let c = []; for(const k of nameKeys(r.name)){ c = byName.get(k) || []; if(c.length) break; }
      if(c.length > 1){ const d = matchDept(r.dept, deptMap); const cc = d ? c.filter(x => x.department_id === d.id) : []; if(cc.length === 1) c = cc; }
      if(c.length > 1){ out.errors.push(`${r.line}-р мөр: "${r.name}" нэртэй ${c.length} ажилтан байна — "Код" багана нэмбэл ялгана`); out.resolved[i] = 'skip'; return; }
      e = c[0]; }
    if(e){
      out.resolved[i] = e;
      const d = matchDept(r.dept, deptMap), patch = {};
      if(r.dept && !d && !out.newDepts.includes(r.dept)) out.newDepts.push(r.dept);
      if(d && d.id !== e.department_id) patch.department_id = d.id;
      if(r.dept && !d) patch._dept = r.dept;
      if(r.pos && r.pos !== (e.position||'')) patch.position = r.pos;
      if(r.email && r.email.toLowerCase() !== (e.email||'').toLowerCase()) patch.email = r.email;
      if(r.phone && String(r.phone) !== String(e.phone||'')) patch.phone = String(r.phone);
      if(S.extra && r.roster && r.roster !== (e.roster||'')) patch.roster = r.roster;
      if(S.extra && r.poi && r.poi !== (e.poi||'')) patch.poi = r.poi;
      if(r.hired && r.hired !== e.hired_on) patch.hired_on = r.hired;
      if(r.code && !e.emp_code) patch.emp_code = r.code;
      if(r.name && r.code && r.name !== e.full_name) patch.full_name = r.name;
      if(!e.active) patch.active = true;
      if(Object.keys(patch).length) out.empUpd.push({ e, patch, row:r }); else out.empSame++;
    } else if(!r.name){ out.errors.push(`${r.line}-р мөр: "${r.code}" кодтой ажилтан системд алга, нэр нь хоосон`); out.resolved[i] = 'skip'; }
    else if(!opt.addNew){ out.errors.push(`${r.line}-р мөр: "${r.name}" системд алга (алгаслаа)`); out.resolved[i] = 'skip'; }
    else {
      const k = r.code ? 'c:' + codeK(r.code) : 'n:' + normKey(r.name);
      if(newKeys.has(k)){ out.resolved[i] = newKeys.get(k); return; }
      if(r.dept && !matchDept(r.dept, deptMap) && !out.newDepts.includes(r.dept)) out.newDepts.push(r.dept);
      const ne = { _new:true, row:r }; out.empNew.push(ne); newKeys.set(k, ne); out.resolved[i] = ne;
    }
  });
  const seen = new Set();
  for(const x of P.recs){
    const who = out.resolved[x.emp]; if(!who || who === 'skip') continue;
    const tk = normKey(x.type); let t = typeMap.get(tk);
    if(!t){ let nt = out.newTypes.find(n => normKey(n.name) === tk); if(!nt){ nt = { name:x.type, months:opt.months[tk] || qMonths(tk) || 12 }; out.newTypes.push(nt); } t = { _new:true, name:nt.name, validity_months:nt.months }; }
    else if(qMonths(tk) && qMonths(tk) !== t.validity_months && !out.typeFix.some(f => f.id === t.id)) out.typeFix.push({ id:t.id, name:t.name, from:t.validity_months, to:qMonths(tk) });
    const m = qMonths(tk) || t.validity_months;
    let done = x.done, exp = x.exp;
    if(x.date && !done && !exp){ if(opt.mode === 'exp') exp = x.date; else done = x.date; }
    if(exp && !done && Q){ const code = normKey(P.emps[x.emp].code); const qd = code && Q.done.get(code + '|' + tk + '|' + exp); if(qd && qd <= exp){ done = qd; out.fromQual++; } }
    if(done && !exp) exp = addMonths(done, m); if(exp && !done) done = addMonths(exp, -m);
    if(exp < done){ out.errors.push(`${x.line}-р мөр: "${x.type}" дуусах огноо хамрагдсанаас өмнө байна`); continue; }
    const dk = (who._new ? 'n' + out.empNew.indexOf(who) : who.id) + '|' + tk + '|' + done;
    if(seen.has(dk)) continue; seen.add(dk);
    if(!who._new && !t._new){
      const ex = S.trs.filter(r => r.employee_id === who.id && r.training_type_id === t.id);
      if(ex.some(r => r.completed_on === done || r.expires_on === exp)){ out.recSame++; continue; }
      const cur = ex.reduce((a, r) => !a || r.expires_on > a.expires_on ? r : a, null);
      if(cur && cur.expires_on > exp){ out.recOld++; continue; }
    }
    out.recNew.push({ who, t, tk, done, exp, cert:x.cert || null, prov:x.prov || null });
  }
  const seenIds = new Set(out.resolved.filter(x => x && x !== 'skip' && !x._new).map(x => x.id));
  out.deact = S.emps.filter(e => e.active && !seenIds.has(e.id));
  out.mgrLinks = P.emps.map((r, i) => r.mgr && out.resolved[i] && out.resolved[i] !== 'skip' ? { who:out.resolved[i], mgr:r.mgr } : null).filter(Boolean);
  return out;
}

async function startImport(file){
  if(!file) return;
  if(file.size > 15 * 1024 * 1024) return toast('Файл хэт том байна (15 MB-аас бага байх ёстой)', 'bad');
  openModal({ title:'Файл уншиж байна', body:'<div style="display:grid;place-items:center;padding:24px"><div class="spinner"></div></div>' });
  try{
    const sheets = await readSheets(file);
    if(sheets.some(isBookSheet) && !sheets.some(sh => /^\s*matrix\s*$/i.test(sh.name))) return startBookImport(file, sheets); // захиалгын файл
    if(!sheets.length) throw new Error('Файл хоосон байна');
    // гарчиг олдох хамгийн их мөртэй sheet-ийг сонгоно
    let si = 0, bestN = -1;
    const mx = sheets.findIndex(sh => /^\s*matrix\s*$/i.test(sh.name));
    if(mx >= 0) si = mx; // "Matrix" sheet байвал түүнийг ашиглана
    else sheets.forEach((sh, i) => { try{ const P = parseMatrix(sh.rows); const n = P.recs.length * 2 + P.emps.length; if(n > bestN){ bestN = n; si = i; } } catch{} });
    const qual = buildQual(sheets.filter((_, i) => i !== si));
    S.imp = { file:file.name, sheets, si, mode:null, months:{}, addNew:true, qual, deactivate: mx >= 0 };
    parseCurrent(); renderImport();
  } catch(e){ console.error(e); closeModal(); toast(e.message || String(e), 'bad'); }
}
function parseCurrent(){
  const im = S.imp; im.err = null;
  try{ im.P = parseMatrix(im.sheets[im.si].rows);
    if(!im.mode && im.qual){ // огноо нь Qualification-ийн дуусах эсвэл хамрагдсан огноотой таарч байгааг тоолж шийднэ
      let e = 0, d = 0; const exps = new Set([...im.qual.done.keys()].map(k => k.split('|').slice(1).join('|'))), dones = new Set([...im.qual.done].map(([k, v]) => k.split('|')[1] + '|' + v));
      for(const x of im.P.recs.slice(0, 400)) if(x.date){ const k = normKey(x.type) + '|' + x.date; if(exps.has(k)) e++; if(dones.has(k)) d++; }
      if(e + d) im.mode = e >= d ? 'exp' : 'done';
    }
    if(!im.mode) im.mode = im.P.guess; }
  catch(e){ im.P = null; im.err = e.message; }
}

    ${im.qual ? `<p class="note">Хамрагдсан огноо, хүчинтэй хугацааг <b>${esc(im.qual.sheet)}</b> sheet-ээс тулгаж авлаа (${pl.fromQual} бичлэг).${pl.typeFix.length ? ` ${pl.typeFix.length} сургалтын хүчинтэй хугацаа засагдана.` : ''}</p>` : ''}
    ${pl.newDepts.length ? `<p class="note">Шинэ алба үүснэ: ${pl.newDepts.map(esc).join(', ')}</p>` : ''}
    ${pl.deact.length ? `<label class="check"><input type="checkbox" data-imp="deactivate" ${im.deactivate ? 'checked' : ''}>Файлд байхгүй <b>${pl.deact.length}</b> ажилтныг "ажлаас гарсан" болгох</label>` : ''}
    <label class="check"><input type="checkbox" data-imp="addNew" ${im.addNew ? 'checked' : ''}>Системд байхгүй ажилтныг шинээр нэмэх</label>

    <div class="m-foot"><button class="btn" data-act="close">Болих</button><button class="btn btn-primary" data-act="imp-apply" ${pl.recNew.length + pl.empNew.length + pl.empUpd.length + pl.mgrLinks.length + pl.typeFix.length + (im.deactivate ? pl.deact.length : 0) ? '' : 'disabled'}>Оруулах</button></div>`;
  openModal({ title:`Импорт · ${im.file}`, wide:true, body });
}
async function applyImport(){
  const im = S.imp, pl = im.plan; if(!pl) return;
  // 1. алба
  const deptMap = new Map(S.depts.map(d => [normKey(d.name), d]));
  const undo = { depts:[], types:[], emps:[], trainings:[], patches:[] };
  if(pl.newDepts.length){ const made = await dbInsert('departments', pl.newDepts.map((n, i) => ({ name:n, sort:S.depts.length + i + 1 }))); made.forEach(d => { deptMap.set(normKey(d.name), d); undo.depts.push(d.id); }); }
  const deptId = n => matchDept(n, deptMap)?.id ?? null;
  // 2. сургалтын төрөл
  const typeMap = new Map(S.types.map(t => [normKey(t.name), t]));
  if(pl.newTypes.length){ const made = await dbInsert('training_types', pl.newTypes.map(n => ({ name:n.name, validity_months:Math.max(1, Number(n.months) || 12) }))); made.forEach(t => { typeMap.set(normKey(t.name), t); undo.types.push(t.id); }); }
  for(const f of pl.typeFix){ undo.typeFix = undo.typeFix || []; undo.typeFix.push({ id:f.id, old:f.from }); await dbUpdate('training_types', f.id, { validity_months:f.to }); }
  // 3. шинэ ажилтан
  if(pl.empNew.length){
    const made = await dbInsert('employees', pl.empNew.map(({ row:r }) => ({ emp_code:r.code || null, full_name:r.name, department_id:deptId(r.dept), position:r.pos || null, email:r.email || null, phone:r.phone ? String(r.phone) : null, hired_on:r.hired || null, active:true, ...(S.extra ? { roster:r.roster || null, poi:r.poi || null } : {}) })));
    made.forEach((e, i) => { pl.empNew[i].id = e.id; undo.emps.push(e.id); });
  }
  // 4. мэдээлэл шинэчлэх
  const remember = (id, p) => { const cur = IDX.emp.get(id); if(!cur) return; const old = {}; for(const k of Object.keys(p)) old[k] = cur[k] ?? null; undo.patches.push({ id, old }); };
  for(const u of pl.empUpd){ const p = { ...u.patch }; if(p._dept){ p.department_id = deptId(p._dept); delete p._dept; } if(Object.keys(p).length){ remember(u.e.id, p); await dbUpdate('employees', u.e.id, p); } }
  let deact = 0;
  if(im.deactivate) for(const e of pl.deact){ remember(e.id, { active:false }); await dbUpdate('employees', e.id, { active:false }); deact++; }
  // 5. удирдлагын холбоос
  let links = 0;
  if(pl.mgrLinks.length){
    const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [codeK(e.emp_code), e]));
    const byName = new Map(); S.emps.forEach(e => nameKeys(e.full_name).forEach(k => { if(!byName.has(k)) byName.set(k, []); byName.get(k).push(e); }));
    for(const l of pl.mgrLinks){
      const id = l.who._new ? l.who.id : l.who.id; let m = byCode.get(codeK(l.mgr));
      if(!m){ for(const k of nameKeys(l.mgr)){ const c = byName.get(k) || []; if(c.length === 1){ m = c[0]; break; } } }
      const me = IDX.emp.get(id);
      if(m && me && m.id !== id && me.manager_id !== m.id && !isUnder(m.id, id)){ if(!undo.emps.includes(id)) remember(id, { manager_id:m.id }); await dbUpdate('employees', id, { manager_id:m.id }); links++; }
    }
  }
  // 6. сургалтын бичлэг
  const rows = pl.recNew.map(r => ({ employee_id:r.who.id, training_type_id:typeMap.get(r.tk).id, completed_on:r.done, expires_on:r.exp, certificate_no:r.cert, provider:r.prov }));
  if(rows.length){ const made = await dbInsert('trainings', rows); undo.trainings = made.map(x => x.id); }
  const summary = { at:new Date().toISOString(), file:im.file, trainings:rows.length, new_emps:pl.empNew.length, updated:pl.empUpd.length, links, deact };
  const logRow = { at:summary.at, file:im.file, by_email:S.user?.email || null, summary, data:undo, undone_at:null };
  if(DEMO) S.imports.unshift({ ...logRow, id:++DEMO_ID });
  else { const { data, error } = await sb.from('import_log').insert(logRow).select().single(); if(error) console.warn('import_log:', error.message); else S.imports.unshift(data); }
  summary.log_id = S.imports[0]?.at === summary.at ? S.imports[0].id : null;
  try{ summary.photos = await restorePhotos(); } catch(e){ console.warn(e); }
  try{ await saveSettings({ last_import:summary }); } catch(e){ console.warn(e); S.settings.last_import = summary; }
  return summary;
}
async function undoImport(id){
  const log = S.imports.find(x => x.id === id); if(!log || log.undone_at) return;
  const d = log.data || {};
  await dbDeleteMany('trainings', d.trainings || []);
  for(const p of [...(d.patches || [])].reverse()) if(IDX.emp.has(p.id)) await dbUpdate('employees', p.id, p.old);
  for(const f of d.typeFix || []) if(IDX.type.has(f.id)) await dbUpdate('training_types', f.id, { validity_months:f.old });
  for(const id of d.emps || []) if(IDX.emp.get(id)?.active) await dbUpdate('employees', id, { active:false }); // устгахгүй: зураг, бүтэц хадгалагдана
  await dbDeleteMany('training_types', (d.types || []).filter(t => !S.trs.some(r => r.training_type_id === t)));
  await dbDeleteMany('departments', (d.depts || []).filter(x => !S.emps.some(e => e.department_id === x)));
  const at = new Date().toISOString();
  if(!DEMO){ const { error } = await sb.from('import_log').update({ undone_at:at }).eq('id', id); if(error) throw error; }
  log.undone_at = at;
  if(S.settings.last_import?.at === log.at){ const prev = S.imports.find(x => !x.undone_at); try{ await saveSettings({ last_import: prev ? prev.summary : null }); } catch{ S.settings.last_import = prev ? prev.summary : null; } }
  return log;
}
async function wipeAll(withEmps){
  await dbDeleteMany('trainings', S.trs.map(x => x.id));
  if(withEmps) await dbDeleteMany('employees', S.emps.map(x => x.id));
  const keep = new Set(['bp','mt','cp','qaqc','wh','hse','administration','hr']);
  await dbDeleteMany('departments', S.depts.filter(x => !keep.has(normKey(x.name))).map(x => x.id));
  if(!DEMO){ const { error } = await sb.from('import_log').update({ undone_at:new Date().toISOString() }).is('undone_at', null); if(error) console.warn(error.message); }
  S.imports.forEach(x => x.undone_at = x.undone_at || new Date().toISOString());
  try{ await saveSettings({ last_import:null }); } catch{ S.settings.last_import = null; }
}
