<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сургалтын Бүртгэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Layout: fixed left rail of sections + one working column; collapses to a top tab bar on phones */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eceff5; --line:#d9dee8; --line-2:#e8ebf2;
  --fg:#172033; --muted:#5a6479; --faint:#8a93a6;
  --accent:#1c4e8f; --accent-hover:#163f75; --accent-fg:#ffffff; --accent-soft:#e2eaf6;
  --ok:#1d7347; --ok-soft:#dff1e6; --warn:#9a5800; --warn-soft:#fcecd2;
  --bad:#b0242b; --bad-soft:#fbe1e1; --none:#6b7385; --none-soft:#eceef2;
  --av-l:86%; --av-fl:30%;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.10);
  --ovl:rgba(15,22,36,.45);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* shell — dark sidebar in both themes */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{--s-bg:#131a29;--s-fg:#e8ecf4;--s-muted:#97a2b8;--s-hover:#1e2739;--s-act:#2a3a58;--s-act-fg:#ffffff;--s-line:#222c40;
  background:var(--s-bg);color:var(--s-fg);border-right:1px solid var(--s-line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
:root[data-theme="dark"] .side{--s-bg:#0b1019;--s-hover:#161d2b;--s-act:#22314b;--s-line:#1b2333}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side{--s-bg:#0b1019;--s-hover:#161d2b;--s-act:#22314b;--s-line:#1b2333}}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.side .brand-mark{background:#3d7be0;color:#fff}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.side .brand small{color:var(--s-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--s-muted);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--s-hover);color:var(--s-fg)}
.nav button[aria-current="page"]{background:var(--s-act);color:var(--s-act-fg)}
.nav button:focus-visible{outline-color:#8fb4f0}
.nav svg{flex:none}
.nav .badge{margin-left:auto;background:#e5484d;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:12px;color:var(--s-muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.side-foot .btn-link{color:#8fb4f0}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:861px){.main{padding-left:32px;padding-right:32px}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));gap:12px;border-right:0;border-bottom:1px solid var(--s-line);overflow-x:auto}
  .brand div{display:none}
  .nav{flex-direction:row}
  .nav button span.lbl{font-size:13px}
  .side-foot{display:none}
}

.demo-bar{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.demo-bar b{font-weight:600}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--bad)}
.btn-danger:hover{border-color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-s{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;flex:1 1 160px}
.toolbar .search{flex:2 1 220px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h2{font-size:15px;font-weight:600}
.panel-body{padding:16px 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile:hover{border-color:var(--faint)}
.tile .t-lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .t-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tile .t-sub{font-size:12px;color:var(--faint)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,transparent)}
.tile.ok{--tc:var(--ok)} .tile.warn{--tc:var(--warn)} .tile.bad{--tc:var(--bad)}
.tile.warn .t-num{color:var(--warn)} .tile.bad .t-num{color:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-none{background:var(--none-soft);color:var(--none)}
.chip-plain{background:var(--surface-2);color:var(--muted)}
.chip-plain::before{display:none}

/* avatar */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--surface-2)}
.av-ini{background:hsl(var(--h) 42% var(--av-l));color:hsl(var(--h) 45% var(--av-fl));font-weight:600}
.av-sm{width:30px;height:30px;font-size:11px}
.av-md{width:40px;height:40px;font-size:14px}
.av-lg{width:56px;height:56px;font-size:18px}
.av-xl{width:112px;height:112px;font-size:34px}
.av-pick{position:relative;display:inline-grid;border-radius:50%;cursor:pointer;flex:none}
.av-cam{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;border:2px solid var(--surface);opacity:0;transition:opacity .15s}
.av-pick.no-photo .av-cam{opacity:.85}
.av-pick:hover .av-cam,.av-pick:focus-visible .av-cam{opacity:1}
.av-pick:hover .av{filter:brightness(.92)}
.av-pick.busy .av{opacity:.4}
.av-sm + .av-cam,.av-pick .av-sm ~ .av-cam{width:16px;height:16px;right:-4px;bottom:-4px}
@media (hover:none){.av-cam{opacity:1}}
.photo-over{outline:2px dashed var(--accent);outline-offset:2px}

/* dept bars */
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) 56px minmax(0,1.5fr) 46px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover .dname{color:var(--accent)}
.dname{font-weight:500;min-width:0;overflow-wrap:anywhere}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-bad{background:var(--bad)}
.pct{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* people rows */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow:hover .p-name{color:var(--accent)}
.p-name{font-weight:500;overflow-wrap:anywhere}
.p-sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.p-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* employee cards */
.count{margin:0 0 10px;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;text-align:left;cursor:pointer;align-items:start}
.ecard:hover{border-color:var(--accent)}
.ecard .e-name{font-weight:600;overflow-wrap:anywhere}
.ecard .e-pos{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ecard .e-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;display:block}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)}
.ecard.inactive{opacity:.6}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .who{display:flex;gap:10px;align-items:center;min-width:180px}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tr.old td{color:var(--faint)}

/* modal / drawer */
.ovl{position:fixed;inset:0;background:var(--ovl);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:560px;margin-top:4vh}
.modal.wide{max-width:820px}
.ovl.is-drawer{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--surface);width:100%;max-width:640px;min-height:100%;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);gap:10px}
.m-head h2{font-size:16px;font-weight:600}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
#confirm-root .ovl{z-index:60}

.prof-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:520px){.prof-top{grid-template-columns:1fr}}
.prof-photo{display:flex;flex-direction:column;gap:10px;align-items:center}
.prof-top h3{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 0;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h4{font-size:14px;font-weight:600}
.tr-card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.tr-card .tr-name{font-weight:600}
.tr-card .tr-meta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.tr-card .tr-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tr-list{display:flex;flex-direction:column;gap:8px}
details.hist summary{cursor:pointer;color:var(--muted);font-size:13px}

.pick-list{border:1px solid var(--line);border-radius:8px;max-height:320px;overflow-y:auto}
.pick-list label{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pick-list label:last-child{border-bottom:0}
.pick-list label:hover{background:var(--surface-2)}

.set-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;padding:6px 0}
.set-row.two{grid-template-columns:minmax(0,1fr) auto}
.days-chips{display:flex;gap:6px;flex-wrap:wrap}
pre.code{background:var(--surface-2);border-radius:7px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;overflow-x:auto;margin:0;white-space:pre}
.mail{border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:13.5px}
.mail-h{background:var(--surface-2);padding:10px 14px;font-size:12.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.mail-h span{color:var(--muted)}
.mail-b{padding:14px;display:flex;flex-direction:column;gap:8px}
.mail-b p{margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* teams (Алба) */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tcard-code{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tcard-head{display:flex;gap:10px;align-items:center;min-width:0}
.tcard-head .p-sub{display:block}
.tcard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.faces{display:flex}
.faces .av{border:2px solid var(--surface);margin-left:-8px}
.faces .av:first-child{margin-left:0}
.faces .av-sm{font-size:10px}
.org-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.org-stats{display:flex;gap:8px;flex-wrap:wrap}
.org-scroll{overflow-x:auto;padding:20px 12px 24px}
.tree,.tree ul{display:flex;justify-content:center;list-style:none;margin:0;padding:20px 0 0;position:relative}
.tree{padding-top:0;min-width:max-content;margin:0 auto}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:20px 6px 0}
.tree > li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1.5px solid var(--faint)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--faint)}
.tree li:only-child::before{display:none}
.tree li:only-child::after{border-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child:not(:only-child)::before{border-right:1.5px solid var(--faint);border-top-right-radius:6px}
.tree li:first-child:not(:only-child)::after{border-top-left-radius:6px}
.tree > li::before,.tree > li::after{display:none}
.tree ul::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:1.5px solid var(--faint)}
.leaf-group{margin-top:20px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.leaf-group::before{content:"";position:absolute;top:-21px;left:50%;height:20px;border-left:1.5px solid var(--faint)}
.onode{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--nc,var(--line));border-radius:9px;padding:7px 10px;width:200px;text-align:left;cursor:pointer;position:relative}
.onode:hover{border-color:var(--accent);border-left-color:var(--nc,var(--accent))}
.onode.head{box-shadow:var(--shadow)}
.onode.st-ok{--nc:var(--ok)} .onode.st-warn{--nc:var(--warn)} .onode.st-bad{--nc:var(--bad)} .onode.st-none{--nc:var(--none)}
.on-txt{min-width:0;display:flex;flex-direction:column}
.on-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on-pos{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on-cnt{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--accent-fg);font-size:10.5px;font-weight:700;border-radius:10px;padding:0 6px;line-height:17px}
.ext-mgr{font-size:12px;color:var(--muted);margin-bottom:-12px;display:flex;align-items:center;gap:6px}
.loose{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.loose .onode{width:auto}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;background:var(--surface);cursor:pointer;font-size:12.5px}
.pchip:hover{border-color:var(--accent)}

/* import preview */
.imp-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.imp-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.imp-sum div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.imp-sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.imp-sum span{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.last-imp{font-size:12.5px;color:var(--muted)}

.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login .panel{width:100%;max-width:380px}

#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px}
.toast.bad{background:var(--bad);color:#fff}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
</style>

<body>

<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ============================================================
   ТОХИРГОО — Supabase-ийн мэдээллээ энд оруулна.
   Хоосон байвал апп ДЕМО горимоор (жишээ өгөгдөлтэй) ажиллана.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://gtzkbyencvvrfunfwxvn.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_L_OS_lJuW7-4oWGw12uYzA_gB3nQnn5'   // publishable key — нийтэд харагдахад аюулгүй (RLS хамгаална)
};

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const TABLES = { departments:'depts', employees:'emps', training_types:'types', trainings:'trs', reminder_log:'logs' };
const S = {
  ready:false, auth:null, user:null, view:'dash',
  depts:[], emps:[], types:[], trs:[], logs:[],
  settings:{ reminder_days:[30,14,7,1,0], hr_email:'', from_email:'Сургалт <noreply@otpclicenses.mn>', company_name:'Манай байгууллага', last_import:null },
  ef:{ q:'', dept:'', status:'', inactive:false },
  tf:{ q:'', dept:'', type:'', status:'' },
  openEmp:null, org:null, imp:null
};
let IDX = {}; let DEMO_ID = 0;

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysUntil = s => Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000);
function addMonths(s, n){ const d=parseYmd(s), day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+n, 1); const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); }
function addDays(s, n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const fmtDate = s => s ? s.replaceAll('-', '.') : '—';
const num = v => v === '' || v == null ? null : Number(v);
function normDate(v){
  v = String(v||'').trim(); if(!v) return null;
  let m = v.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function toast(msg, kind=''){ const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(), kind==='bad'?6000:3200); }
function errMsg(e){ const m = e?.message || String(e); if(e?.code==='23505') return 'Давхардсан утга байна (код эсвэл нэр өөр байх ёстой).'; if(/JWT|session/i.test(m)) return 'Нэвтрэлт дууссан байна. Дахин нэвтэрнэ үү.'; return 'Алдаа: '+m; }
async function run(fn, okMsg){ try{ const r = await fn(); if(okMsg) toast(typeof okMsg==='function'?okMsg(r):okMsg); return r; } catch(e){ console.error(e); toast(errMsg(e),'bad'); } }

/* ---------- status ---------- */
const warnDays = () => { const d = S.settings.reminder_days || []; return d.length ? Math.max(...d) : 30; };
const statusOf = d => d < 0 ? 'bad' : d <= warnDays() ? 'warn' : 'ok';
const ST = { ok:'Хүчинтэй', warn:'Дуусах дөхсөн', bad:'Хугацаа дууссан', none:'Сургалтгүй' };
const chip = (st, txt) => `<span class="chip chip-${st}">${esc(txt ?? ST[st])}</span>`;
function daysText(d){ if(d < 0) return `${-d} хоног хэтэрсэн`; if(d === 0) return 'Өнөөдөр дуусна'; return `${d} хоног үлдсэн`; }

function reindex(){
  IDX.dept = new Map(S.depts.map(d => [d.id, d]));
  IDX.emp  = new Map(S.emps.map(e => [e.id, e]));
  IDX.type = new Map(S.types.map(t => [t.id, t]));
  const cur = new Map();
  for(const t of S.trs){
    const k = t.employee_id+':'+t.training_type_id, p = cur.get(k);
    if(!p || t.expires_on > p.expires_on || (t.expires_on === p.expires_on && t.id > p.id)) cur.set(k, t);
  }
  IDX.currentIds = new Set();
  IDX.current = [...cur.values()].filter(t => IDX.emp.has(t.employee_id) && IDX.type.has(t.training_type_id)).map(t => {
    IDX.currentIds.add(t.id); const days = daysUntil(t.expires_on); return { ...t, days, status: statusOf(days) };
  });
  IDX.byEmp = new Map();
  for(const c of IDX.current){ if(!IDX.byEmp.has(c.employee_id)) IDX.byEmp.set(c.employee_id, []); IDX.byEmp.get(c.employee_id).push(c); }
}
function empStatus(id){ const l = IDX.byEmp.get(id) || []; if(!l.length) return 'none'; if(l.some(c=>c.status==='bad')) return 'bad'; if(l.some(c=>c.status==='warn')) return 'warn'; return 'ok'; }
const activeCurrent = () => IDX.current.filter(c => IDX.emp.get(c.employee_id).active);
const deptName = id => IDX.dept.get(id)?.name || '—';
const typeName = id => IDX.type.get(id)?.name || '—';
const sortedDepts = () => [...S.depts].sort((a,b) => (a.sort??0)-(b.sort??0) || a.name.localeCompare(b.name,'mn'));
const sortedTypes = () => [...S.types].sort((a,b) => a.name.localeCompare(b.name,'mn'));

function pendingReminders(){
  const days = [...(S.settings.reminder_days||[])].sort((a,b)=>a-b);
  const out = [];
  for(const c of activeCurrent()){
    if(c.days < 0) continue;
    const b = days.find(d => d >= c.days); if(b == null) continue;
    if(S.logs.some(l => l.training_id === c.id && l.days_before === b)) continue;
    out.push({ ...c, bucket:b });
  }
  return out.sort((a,b)=>a.days-b.days);
}

function initials(n){ const p = String(n||'').replace(/^[А-ЯӨҮЁA-Z]\.\s*/u,'').trim().split(/\s+/); return (p[0]||'?').slice(0,2).toUpperCase(); }
function avatar(e, size='md'){
  if(e?.photo_url) return `<img class="av av-${size}" src="${esc(e.photo_url)}" alt="">`;
  const h = ((e?.id||1) * 47) % 360;
  return `<span class="av av-${size} av-ini" style="--h:${h}" aria-hidden="true">${esc(initials(e?.full_name))}</span>`;
}

const CAM = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
// Зураг дээр дарж шууд оруулах/солих
function avatarPick(e, size='md'){
  return `<span class="av-pick ${e.photo_url?'':'no-photo'}" data-act="pick-photo" data-id="${e.id}" role="button" tabindex="0" title="${e.photo_url?'Зураг солих':'Зураг оруулах'} (эсвэл зургаа энд чирж оруулна)" aria-label="${esc(e.full_name)}: зураг ${e.photo_url?'солих':'оруулах'}">${avatar(e,size)}<span class="av-cam" aria-hidden="true">${CAM}</span></span>`;
}
async function setPhoto(id, file){
  if(!file || !/^image\//.test(file.type)) return toast('Зураг (jpg, png…) сонгоно уу','bad');
  $$(`.av-pick[data-id="${id}"]`).forEach(x => x.classList.add('busy'));
  const r = await run(() => uploadPhoto(id, file), 'Зураг хадгалагдлаа');
  $$(`.av-pick[data-id="${id}"]`).forEach(x => x.classList.remove('busy'));
  if(r) refresh();
}

/* ---------- data layer ---------- */
async function fetchAll(table){
  const out = []; const step = 1000;
  for(let from=0;;from+=step){
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from+step-1);
    if(error) throw error; out.push(...data); if(data.length < step) break;
  }
  return out;
}
async function loadAll(){
  if(DEMO){ seedDemo(); return; }
  const [d,e,t,tr] = await Promise.all(['departments','employees','training_types','trainings'].map(fetchAll));
  const l = await sb.from('reminder_log').select('*').order('sent_at',{ascending:false}).limit(2000);
  const s = await sb.from('settings').select('*').eq('id',1).maybeSingle();
  if(l.error) throw l.error; if(s.error) throw s.error;
  Object.assign(S, { depts:d, emps:e, types:t, trs:tr, logs:l.data });
  if(s.data) S.settings = s.data;
}
async function dbInsert(table, rows){
  const arr = Array.isArray(rows) ? rows : [rows]; let out = [];
  if(DEMO){ out = arr.map(r => ({ ...r, id: ++DEMO_ID, created_at: new Date().toISOString() })); }
  else for(let i=0;i<arr.length;i+=500){ const { data, error } = await sb.from(table).insert(arr.slice(i,i+500)).select(); if(error) throw error; out.push(...data); }
  S[TABLES[table]].push(...out); reindex();
  return Array.isArray(rows) ? out : out[0];
}
async function dbUpdate(table, id, patch){
  const list = S[TABLES[table]]; const i = list.findIndex(x => x.id === id); let row;
  if(DEMO) row = { ...list[i], ...patch };
  else { const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single(); if(error) throw error; row = data; }
  if(i >= 0) list[i] = row; reindex(); return row;
}
async function dbDelete(table, id){
  if(!DEMO){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }
  const k = TABLES[table]; S[k] = S[k].filter(x => x.id !== id);
  if(table === 'employees'){ S.trs = S.trs.filter(t => t.employee_id !== id); S.emps.forEach(e => { if(e.manager_id === id) e.manager_id = null; }); }
  if(table === 'training_types') S.trs = S.trs.filter(t => t.training_type_id !== id);
  if(table === 'departments') S.emps.forEach(e => { if(e.department_id === id) e.department_id = null; });
  if(table === 'trainings') S.logs = S.logs.filter(l => l.training_id !== id);
  reindex();
}
async function saveSettings(patch){
  if(DEMO) Object.assign(S.settings, patch);
  else { const { data, error } = await sb.from('settings').update({ ...patch, updated_at:new Date().toISOString() }).eq('id',1).select().single(); if(error) throw error; S.settings = data; }
  reindex();
}
async function sendNow(){
  if(DEMO){
    const p = pendingReminders(); const now = new Date().toISOString();
    for(const x of p){ const e = IDX.emp.get(x.employee_id); S.logs.unshift({ id:++DEMO_ID, training_id:x.id, days_before:x.bucket, recipients:JSON.stringify([e.email, S.settings.hr_email].filter(Boolean)), sent_at:now }); }
    return p.length;
  }
  const { data, error } = await sb.rpc('send_training_reminders'); if(error) throw error;
  const l = await sb.from('reminder_log').select('*').order('sent_at',{ascending:false}).limit(2000);
  if(!l.error) S.logs = l.data;
  return data;
}
function resizeImage(file, size=360){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height); const ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob:b, dataUrl:c.toDataURL('image/jpeg', .85) }) : rej(new Error('Зураг уншиж чадсангүй')), 'image/jpeg', .85);
    };
    img.onerror = () => rej(new Error('Зургийн формат танигдсангүй'));
    img.src = url;
  });
}
async function uploadPhoto(empId, file){
  const { blob, dataUrl } = await resizeImage(file);
  if(DEMO) return dbUpdate('employees', empId, { photo_url:dataUrl });
  const path = `emp-${empId}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false }); // нэр нь давтагдахгүй тул дарж бичих шаардлагагүй
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return dbUpdate('employees', empId, { photo_url:data.publicUrl });
}

/* ---------- demo data ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',ө:'u',п:'p',р:'r',с:'s',т:'t',у:'u',ү:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'y',ь:'i',э:'e',ю:'yu',я:'ya','-':''};
const translit = s => [...s.toLowerCase()].map(c => TR[c] ?? c).join('');
function seedDemo(){

  let id = 0; const nid = () => ++id;
  // [нэр, хүний тоо, удирдлагын албан тушаал, ахлах албан тушаал, ажилтны албан тушаалууд]
  const D = [
    ['BP',34,'BP албаны менежер','Ээлжийн ахлагч',['Оператор','Ахлах оператор','Техникч','Туслах оператор']],
    ['MT',30,'MT албаны менежер','Засварын ахлагч',['Механик','Цахилгаанчин','Гагнуурчин','Слесарь']],
    ['CP',28,'CP албаны менежер','Ээлжийн ахлагч',['Оператор','Техникч','Лаборант','Туслах ажилтан']],
    ['QAQC',14,'QAQC менежер','Ахлах инженер',['Чанарын инженер','Лаборант','Хяналтын техникч']],
    ['WH',16,'Агуулахын менежер','Ахлах нярав',['Нярав','Ачигч','Тээврийн жолооч','Агуулахын ажилтан']],
    ['HSE',10,'HSE менежер','Ахлах мэргэжилтэн',['ХАБ-ын мэргэжилтэн','Байгаль орчны мэргэжилтэн','ХАБ-ын байцаагч']],
    ['Administration',10,'Захиргааны менежер','Ахлах мэргэжилтэн',['Захиргааны ажилтан','Бичиг хэрэг','Жолооч','Нягтлан бодогч']],
    ['HR',8,'Хүний нөөцийн менежер','Ахлах мэргэжилтэн',['Хүний нөөцийн мэргэжилтэн','Сургалтын зохицуулагч','Цалингийн нягтлан']]
  ];
  const T = [['ХАБЭА ерөнхий зааварчилгаа',12,'ХАБ','Дотоод сургалт'],['Галын аюулгүй байдал',12,'ГАБ','ОБЕГ'],['Анхны тусламж',24,'АТ','Улаан загалмай'],['Өндөрт ажиллах',12,'ӨА','Дотоод сургалт'],['Цахилгааны аюулгүй ажиллагаа',12,'ЦАА','Эрчим хүчний сургалтын төв'],['Өргөх механизм, ачаа өргөлт',24,'ӨМ','МХЕГ'],['Химийн бодистой ажиллах',24,'ХБ','Дотоод сургалт']];
  const NEED = [[0,1,3],[0,1,4,3],[0,1,6],[0,1,6],[0,1,5],[0,1,2,3],[0,1],[0,1]];
  const OPT  = [[[2,.4],[5,.3]],[[5,.6],[2,.4]],[[2,.4],[3,.3]],[[2,.3]],[[2,.4]],[[6,.5]],[[2,.3]],[[2,.3]]];
  const FN = ['Батбаяр','Энхтуяа','Ганболд','Сарантуяа','Мөнхбат','Оюунчимэг','Төмөрбаатар','Нармандах','Болормаа','Эрдэнэбат','Ариунаа','Батцэцэг','Дашдорж','Анударь','Тэмүүлэн','Хонгорзул','Билгүүн','Номин','Мөнх-Эрдэнэ','Цэцэгмаа','Ганзориг','Солонго','Баярсайхан','Уянга','Отгонбаяр','Наранцэцэг','Пүрэвдорж','Мишээл','Жавхлан','Гэрэлмаа','Чингүүн','Алтанцэцэг','Энхжаргал','Сүхбат','Индра','Хулан','Бат-Очир','Сондор','Ундрах','Золбоо'];
  const LI = ['А','Б','Г','Д','Л','М','Н','О','П','С','Т','Х','Ц','Ч','Ж','Э'];
  S.depts = D.map(([n],i) => ({ id:nid(), name:n, sort:i+1 }));
  S.types = T.map(([n,m]) => ({ id:nid(), name:n, validity_months:m, description:'' }));
  S.emps = []; S.trs = []; S.logs = [];
  const used = new Set(); let k = 0, cert = 100;
  const mkEmp = (di, pos, mgr) => {
    k++; const fn = pick(FN), li = pick(LI);
    let mail = translit(li)+'.'+translit(fn); const base = mail; let j = 2; while(used.has(mail)) mail = base + (j++); used.add(mail);
    const e = { id:nid(), emp_code:'E'+String(k).padStart(3,'0'), full_name:`${li}.${fn}`, department_id:S.depts[di].id, position:pos,
      email:mail+'@otpclicenses.mn', phone:'9'+Math.floor(1000000+R()*8999999), photo_url:null, active: mgr == null || R() > .02,
      manager_id:mgr, hired_on:addDays(today, -Math.round(60 + R()*3600)), notes:'' };
    S.emps.push(e);
    const need = [...NEED[di], ...OPT[di].filter(([, p]) => R() < p).map(([t]) => t)];
    for(const ti of need){
      const [, m, pre, prov] = T[ti];
      const span = m * 30.4; const off = Math.round(R() * (span + 45));
      const done = addDays(today, -off);
      if(R() < .3){ const pd = addDays(addMonths(done, -m), -Math.round(R()*20)); S.trs.push({ id:nid(), employee_id:e.id, training_type_id:S.types[ti].id, completed_on:pd, expires_on:addMonths(pd, m), certificate_no:`${pre}-${pd.slice(0,4)}-${String(cert++).padStart(4,'0')}`, provider:prov, notes:'' }); }
      S.trs.push({ id:nid(), employee_id:e.id, training_type_id:S.types[ti].id, completed_on:done, expires_on:addMonths(done, m), certificate_no:`${pre}-${done.slice(0,4)}-${String(cert++).padStart(4,'0')}`, provider:prov, notes:'' });
    }
    return e;
  };
  D.forEach(([, cnt, headPos, supPos, staffPos], di) => {
    const head = mkEmp(di, headPos, null);
    const nSup = cnt >= 25 ? 3 : cnt >= 12 ? 2 : 1;
    const sups = Array.from({ length:nSup }, () => mkEmp(di, supPos, head.id));
    for(let i = 1 + nSup; i < cnt; i++) mkEmp(di, pick(staffPos), cnt <= 10 && R() < .5 ? head.id : pick(sups).id);
  });
  S.settings = { reminder_days:[30,14,7,1,0], hr_email:'hr@otpclicenses.mn', from_email:'Сургалт <noreply@otpclicenses.mn>', company_name:'ОТП ХХК', last_import:null };
  DEMO_ID = id; reindex();
  const days = [0,1,7,14,30];
  for(const c of IDX.current){
    if(c.days < 0 || c.days > 30 || R() < .45) continue;
    const b = days.find(d => d >= c.days); const e = IDX.emp.get(c.employee_id);
    S.logs.push({ id:++DEMO_ID, training_id:c.id, days_before:b, recipients:JSON.stringify([e.email,'hr@otpclicenses.mn']), sent_at:new Date(Date.now() - Math.round(R()*10)*86400000).toISOString() });
  }
  S.logs.sort((a,b) => b.sent_at.localeCompare(a.sent_at));
}

/* --- teams (Алба) / org chart --- */
function teamTree(deptId){
  const members = S.emps.filter(e => e.active && e.department_id === deptId);
  const inDept = new Set(members.map(e => e.id)), kids = new Map(), roots = [];
  for(const e of members){
    if(e.manager_id && e.manager_id !== e.id && inDept.has(e.manager_id)){ if(!kids.has(e.manager_id)) kids.set(e.manager_id, []); kids.get(e.manager_id).push(e); }
    else roots.push(e);
  }
  const size = new Map(), seen = new Set();
  const count = e => { if(seen.has(e.id)) return 0; seen.add(e.id); let n = 1; for(const c of kids.get(e.id)||[]) n += count(c); size.set(e.id, n); return n; };
  roots.forEach(count);
  members.filter(e => !seen.has(e.id)).forEach(e => { roots.push(e); count(e); }); // давталттай (A→B→A) холбоосыг тасална
  const ord = (a,b) => (size.get(b.id)||1) - (size.get(a.id)||1) || a.full_name.localeCompare(b.full_name,'mn');
  kids.forEach(l => l.sort(ord)); roots.sort(ord);
  return { members, kids, roots, size };
}
function teamStats(members){
  const ids = new Set(members.map(e => e.id)), c = { ok:0, warn:0, bad:0 };
  activeCurrent().forEach(x => { if(ids.has(x.employee_id)) c[x.status]++; });
  const tot = c.ok + c.warn + c.bad;
  return { c, tot, pct: tot ? Math.round(c.ok/tot*100) : 0, w: v => tot ? (v/tot*100).toFixed(1) : 0 };
}

function viewTeam(deptId){
  const d = IDX.dept.get(deptId), t = teamTree(deptId), st = teamStats(t.members);

  const drawn = new Set();
  const branch = (e, depth) => {
    drawn.add(e.id);
    const ch = (t.kids.get(e.id)||[]).filter(c => !drawn.has(c.id));
    const leaves = ch.filter(c => !(t.kids.get(c.id)||[]).length), inner = ch.filter(c => (t.kids.get(c.id)||[]).length);
    leaves.forEach(c => drawn.add(c.id));

    if(ch.length){

    }
    return `<li>${onode(e, depth === 0)}${sub}</li>`;
  };
  const trees = t.roots.filter(r => (t.size.get(r.id)||1) > 1), loose = t.roots.filter(r => (t.size.get(r.id)||1) === 1);
  const ext = r => { const m = r.manager_id && IDX.emp.get(r.manager_id); return m ? `<div class="ext-mgr">${I.up}<span>Удирдлага: <button class="btn-link" data-act="profile" data-id="${m.id}">${esc(m.full_name)}</button> (${esc(deptName(m.department_id))})</span></div>` : ''; };

  return `<div class="page-head"><div class="org-head"><button class="btn btn-sm" data-act="org-back">${I.back}Бүх алба</button><div><h1>${esc(d.name)}</h1><p>${t.members.length} идэвхтэй ажилтан${trees[0] ? ' · Удирдлага: '+esc(trees[0].full_name) : ''}</p></div></div>
    <div class="actions"><button class="btn" data-act="goto-emps" data-dept="${deptId}">Жагсаалтаар харах</button><button class="btn btn-primary" data-act="new-emp" data-dept="${deptId}">+ Ажилтан нэмэх</button></div></div>
  <div class="tiles">
    ${tile('ok','Хүчинтэй сургалт', st.c.ok, `Нийт ${st.tot}-аас ${st.pct}%`, 'ok')}
    ${tile('warn',`${warnDays()} хоногт дуусах`, st.c.warn, 'Сануулга илгээгдэнэ', 'warn')}
    ${tile('bad','Хугацаа дууссан', st.c.bad, 'Давтан сургалт шаардлагатай', 'bad')}

function filteredTrs(){
  const f = S.tf, q = f.q.trim().toLowerCase();
  return activeCurrent().filter(c => {
    const e = IDX.emp.get(c.employee_id);
    if(f.dept && String(e.department_id) !== String(f.dept)) return false;
    if(f.type && String(c.training_type_id) !== String(f.type)) return false;
    if(f.status && c.status !== f.status) return false;
    if(q && !(e.full_name+' '+(e.emp_code||'')+' '+(c.certificate_no||'')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => a.days - b.days);
}

  const l = filteredTrs();
  if(!l.length) return `<div class="panel empty">Тохирох бичлэг олдсонгүй.</div>`;
  return `<p class="count">${l.length} бичлэг</p><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Ажилтан</th><th>Сургалт</th><th>Хамрагдсан</th><th>Дуусах</th><th>Төлөв</th><th>Гэрчилгээ №</th><th></th></tr></thead><tbody>

  </tbody></table></div>`;
}

function openModal({ title, body, wide=false, drawer=false }){
  $('#modal-root').innerHTML = `<div class="ovl ${drawer?'is-drawer':''}" data-act="ovl"><div class="${drawer?'drawer':'modal'+(wide?' wide':'')}" role="dialog" aria-modal="true" aria-label="${esc(title)}">

  const first = $('#modal-root .m-body input:not([type=hidden]):not([type=file]), #modal-root .m-body select'); if(first && !drawer) first.focus();
}
function closeModal(){ $('#modal-root').innerHTML = ''; S.openEmp = null; S.imp = null; }
function askConfirm(msg, okLabel='Устгах'){
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="ovl"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:420px"><div class="m-body"><p style="margin:0">${esc(msg)}</p>
      <div class="m-foot"><button class="btn" data-c="0">Болих</button><button class="btn btn-primary" data-c="1">${esc(okLabel)}</button></div></div></div></div>`;
    root.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { root.innerHTML = ''; res(b.dataset.c === '1'); });
    root.querySelector('[data-c="1"]').focus();
  });
}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0];
  const delim = [';','\t',','].map(d => [d, first.split(d).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}

    if(!name && !code) return;

    const ei = emps.push({ line:lineNo(i), code, name, dept:cellStr(get('dept')) || section, pos:cellStr(get('pos')), email:cellStr(get('email')), phone:cellStr(get('phone')), hired, mgr:cellStr(get('mgr')) }) - 1;
    if(isLong){
      const t = cellStr(r[longCols.ttype]); if(!t) return;
      const done = longCols.done != null ? cellDate(r[longCols.done]) : null, exp = longCols.exp != null ? cellDate(r[longCols.exp]) : null;
      if(!done && !exp){ errors.push(`${lineNo(i)}-р мөр: "${t}" огноо танигдсангүй`); return; }
      recs.push({ emp:ei, line:lineNo(i), type:t, done, exp, date:null, cert:cellStr(r[longCols.cert]), prov:cellStr(r[longCols.prov]) });
    } else for(const g of groups.values()){
      const c = g.cols; const done = c.done != null ? cellDate(r[c.done]) : null, exp = c.exp != null ? cellDate(r[c.exp]) : null, date = c.date != null ? cellDate(r[c.date]) : null;
      if(!done && !exp && !date) continue;
      recs.push({ emp:ei, line:lineNo(i), type:g.name, done, exp, date, cert:c.cert != null ? cellStr(r[c.cert]) : '', prov:c.prov != null ? cellStr(r[c.prov]) : '' });
    }
  });
  const dateVals = recs.filter(x => x.date).map(x => x.date), today = todayStr();
  const guess = dateVals.length && dateVals.filter(d => d > today).length / dateVals.length > .5 ? 'exp' : 'done';
  const found = Object.keys(col).map(k => ({ code:'Код', name:'Овог нэр', last:'Овог', dept:'Алба', pos:'Албан тушаал', email:'Имэйл', phone:'Утас', hired:'Ажилд орсон', mgr:'Удирдлага' })[k]);
  return { headerLine:hi+1, subMode, isLong, found, groups:[...groups.values()].map(g => g.name), skipped, emps, recs, errors, hasAmbig:dateVals.length > 0, guess, sections: !col.dept && emps.some(e => e.dept) };
}

const nameKeys = n => { const k = [normKey(n)]; const w = cellStr(n).split(' '); if(w.length === 2 && !/\./.test(n)) k.push(normKey(w[0][0] + w[1]), normKey(w[1][0] + w[0])); return k; };
function matchDept(name, map){ if(!name) return null; const k = normKey(name); if(map.has(k)) return map.get(k); for(const [dk, d] of map) if(k.startsWith(dk) && dk.length >= 2) return d; return null; }

function planImport(P, opt){
  const deptMap = new Map(S.depts.map(d => [normKey(d.name), d]));
  const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [normKey(e.emp_code), e]));
  const byName = new Map(); S.emps.forEach(e => nameKeys(e.full_name).forEach(k => { if(!byName.has(k)) byName.set(k, []); byName.get(k).push(e); }));
  const typeMap = new Map(S.types.map(t => [normKey(t.name), t]));
  const out = { empNew:[], empUpd:[], empSame:0, recNew:[], recSame:0, recOld:0, newTypes:[], newDepts:[], errors:[...P.errors], resolved:[] };
  const newKeys = new Map();
  P.emps.forEach((r, i) => {
    let e = r.code && byCode.get(normKey(r.code));
    if(!e){ let c = []; for(const k of nameKeys(r.name)){ c = byName.get(k) || []; if(c.length) break; }
      if(c.length > 1){ const d = matchDept(r.dept, deptMap); const cc = d ? c.filter(x => x.department_id === d.id) : []; if(cc.length === 1) c = cc; }
      if(c.length > 1){ out.errors.push(`${r.line}-р мөр: "${r.name}" нэртэй ${c.length} ажилтан байна — "Код" багана нэмбэл ялгана`); out.resolved[i] = 'skip'; return; }
      e = c[0]; }
    if(e){
      out.resolved[i] = e;
      const d = matchDept(r.dept, deptMap), patch = {};
      if(r.dept && !d && !out.newDepts.includes(r.dept)) out.newDepts.push(r.dept);
      if(d && d.id !== e.department_id) patch.department_id = d.id;
      if(r.dept && !d) patch._dept = r.dept;
      if(r.pos && r.pos !== (e.position||'')) patch.position = r.pos;
      if(r.email && r.email.toLowerCase() !== (e.email||'').toLowerCase()) patch.email = r.email;
      if(r.phone && String(r.phone) !== String(e.phone||'')) patch.phone = String(r.phone);
      if(r.hired && r.hired !== e.hired_on) patch.hired_on = r.hired;
      if(r.code && !e.emp_code) patch.emp_code = r.code;
      if(Object.keys(patch).length) out.empUpd.push({ e, patch, row:r }); else out.empSame++;
    } else if(!r.name){ out.errors.push(`${r.line}-р мөр: "${r.code}" кодтой ажилтан системд алга, нэр нь хоосон`); out.resolved[i] = 'skip'; }
    else if(!opt.addNew){ out.errors.push(`${r.line}-р мөр: "${r.name}" системд алга (алгаслаа)`); out.resolved[i] = 'skip'; }
    else {
      const k = r.code ? 'c:' + normKey(r.code) : 'n:' + normKey(r.name);
      if(newKeys.has(k)){ out.resolved[i] = newKeys.get(k); return; }
      if(r.dept && !matchDept(r.dept, deptMap) && !out.newDepts.includes(r.dept)) out.newDepts.push(r.dept);
      const ne = { _new:true, row:r }; out.empNew.push(ne); newKeys.set(k, ne); out.resolved[i] = ne;
    }
  });
  const seen = new Set();
  for(const x of P.recs){
    const who = out.resolved[x.emp]; if(!who || who === 'skip') continue;
    const tk = normKey(x.type); let t = typeMap.get(tk);
    if(!t){ let nt = out.newTypes.find(n => normKey(n.name) === tk); if(!nt){ nt = { name:x.type, months:opt.months[tk] || 12 }; out.newTypes.push(nt); } t = { _new:true, name:nt.name, validity_months:nt.months }; }
    const m = t.validity_months;
    let done = x.done, exp = x.exp;
    if(x.date && !done && !exp){ if(opt.mode === 'exp') exp = x.date; else done = x.date; }
    if(done && !exp) exp = addMonths(done, m); if(exp && !done) done = addMonths(exp, -m);
    if(exp < done){ out.errors.push(`${x.line}-р мөр: "${x.type}" дуусах огноо хамрагдсанаас өмнө байна`); continue; }
    const dk = (who._new ? 'n' + out.empNew.indexOf(who) : who.id) + '|' + tk + '|' + done;
    if(seen.has(dk)) continue; seen.add(dk);
    if(!who._new && !t._new){
      const ex = S.trs.filter(r => r.employee_id === who.id && r.training_type_id === t.id);
      if(ex.some(r => r.completed_on === done || r.expires_on === exp)){ out.recSame++; continue; }
      const cur = ex.reduce((a, r) => !a || r.expires_on > a.expires_on ? r : a, null);
      if(cur && cur.expires_on > exp){ out.recOld++; continue; }
    }
    out.recNew.push({ who, t, tk, done, exp, cert:x.cert || null, prov:x.prov || null });
  }
  out.mgrLinks = P.emps.map((r, i) => r.mgr && out.resolved[i] && out.resolved[i] !== 'skip' ? { who:out.resolved[i], mgr:r.mgr } : null).filter(Boolean);
  return out;
}

async function startImport(file){
  if(!file) return;
  if(file.size > 15 * 1024 * 1024) return toast('Файл хэт том байна (15 MB-аас бага байх ёстой)', 'bad');
  openModal({ title:'Файл уншиж байна', body:'<div style="display:grid;place-items:center;padding:24px"><div class="spinner"></div></div>' });
  try{
    const sheets = await readSheets(file);
    if(!sheets.length) throw new Error('Файл хоосон байна');
    // гарчиг олдох хамгийн их мөртэй sheet-ийг сонгоно
    let si = 0, bestN = -1;
    sheets.forEach((sh, i) => { try{ const P = parseMatrix(sh.rows); const n = P.recs.length * 2 + P.emps.length; if(n > bestN){ bestN = n; si = i; } } catch{} });
    S.imp = { file:file.name, sheets, si, mode:null, months:{}, addNew:true };
    parseCurrent(); renderImport();
  } catch(e){ console.error(e); closeModal(); toast(e.message || String(e), 'bad'); }
}
function parseCurrent(){
  const im = S.imp; im.err = null;
  try{ im.P = parseMatrix(im.sheets[im.si].rows); if(!im.mode) im.mode = im.P.guess; }
  catch(e){ im.P = null; im.err = e.message; }
}
function renderImport(){
  const im = S.imp; if(!im) return;
  const P = im.P, pl = P ? planImport(P, im) : null;
  im.plan = pl;
  const sheetSel = im.sheets.length > 1 ? `<div class="field"><label for="imp-sheet">Хуудас (sheet)</label><select class="inp" id="imp-sheet" data-imp="sheet">${im.sheets.map((s, i) => `<option value="${i}" ${i === im.si ? 'selected' : ''}>${esc(s.name)} (${s.rows.length} мөр)</option>`).join('')}</select></div>` : '';
  let body;
  if(!P) body = `${sheetSel}<p style="margin:0;color:var(--bad)">${esc(im.err)}</p><div class="m-foot"><button class="btn" data-act="close">Хаах</button></div>`;
  else body = `${sheetSel}
    <div class="imp-sum">
      <div><b>${pl.recNew.length}</b><span>Шинэ сургалтын бичлэг</span></div>
      <div><b>${pl.recSame + pl.recOld}</b><span>Өөрчлөлтгүй (алгасна)</span></div>
      <div><b>${pl.empNew.length}</b><span>Шинэ ажилтан</span></div>
      <div><b>${pl.empUpd.length}</b><span>Мэдээлэл шинэчлэгдэх</span></div>
    </div>
    <dl class="kv" style="margin:0"><dt>Гарчиг</dt><dd>${P.headerLine}-р мөр${P.subMode ? ' (2 мөр гарчигтай)' : ''} · ${P.emps.length} ажилтны мөр</dd>
      <dt>Ажилтны багана</dt><dd>${P.found.map(f => `<span class="chip chip-plain">${f}</span>`).join(' ')}${P.sections ? ' <span class="chip chip-plain">Алба (бүлгийн гарчгаас)</span>' : ''}</dd>
      <dt>Сургалт</dt><dd>${P.isLong ? 'Жагсаалт хэлбэр (мөр бүр нэг сургалт)' : P.groups.length ? P.groups.map(g => `<span class="chip ${pl.newTypes.some(n => normKey(n.name) === normKey(g)) ? 'chip-warn' : 'chip-plain'}">${esc(g)}</span>`).join(' ') : '<span class="muted">Сургалтын багана олдсонгүй — зөвхөн ажилтны мэдээлэл шинэчлэгдэнэ</span>'}</dd>
      ${P.skipped.length ? `<dt>Алгассан</dt><dd class="muted">${P.skipped.map(esc).join(', ')} <span class="faint">(огноо агуулаагүй)</span></dd>` : ''}</dl>
    ${P.hasAmbig ? `<div class="field"><span class="lbl-s">Нүдэнд бичигдсэн огноо нь</span><div class="toolbar">
      <label class="check"><input type="radio" name="imp-mode" value="done" data-imp="mode" ${im.mode === 'done' ? 'checked' : ''}>Хамрагдсан огноо</label>
      <label class="check"><input type="radio" name="imp-mode" value="exp" data-imp="mode" ${im.mode === 'exp' ? 'checked' : ''}>Дуусах (хүчинтэй) огноо</label>
      ${im.mode === P.guess ? '<span class="note">· огноонуудаас автоматаар таамагласан</span>' : ''}</div></div>` : ''}
    ${pl.newTypes.length ? `<div class="field"><span class="lbl-s">Шинэ сургалтын төрөл — хүчинтэй хугацаа (сар)</span>${pl.newTypes.map(n => `<div class="set-row two"><span>${esc(n.name)}</span><input class="inp mono" type="number" min="1" style="width:90px" value="${n.months}" data-imp="months" data-k="${esc(normKey(n.name))}" aria-label="${esc(n.name)} сар"></div>`).join('')}</div>` : ''}
    ${pl.newDepts.length ? `<p class="note">Шинэ алба үүснэ: ${pl.newDepts.map(esc).join(', ')}</p>` : ''}
    <label class="check"><input type="checkbox" data-imp="addNew" ${im.addNew ? 'checked' : ''}>Системд байхгүй ажилтныг шинээр нэмэх</label>
    ${pl.errors.length ? `<details class="hist"><summary style="color:var(--bad)">${pl.errors.length} анхааруулга</summary><pre class="code" style="margin-top:6px;max-height:180px;overflow:auto;white-space:pre-wrap">${esc(pl.errors.join('\n'))}</pre></details>` : ''}
    <div class="m-foot"><button class="btn" data-act="close">Болих</button><button class="btn btn-primary" data-act="imp-apply" ${pl.recNew.length + pl.empNew.length + pl.empUpd.length + pl.mgrLinks.length ? '' : 'disabled'}>Оруулах</button></div>`;
  openModal({ title:`Импорт · ${im.file}`, wide:true, body });
}
async function applyImport(){
  const im = S.imp, pl = im.plan; if(!pl) return;
  // 1. алба
  const deptMap = new Map(S.depts.map(d => [normKey(d.name), d]));
  if(pl.newDepts.length){ const made = await dbInsert('departments', pl.newDepts.map((n, i) => ({ name:n, sort:S.depts.length + i + 1 }))); made.forEach(d => deptMap.set(normKey(d.name), d)); }
  const deptId = n => matchDept(n, deptMap)?.id ?? null;
  // 2. сургалтын төрөл
  const typeMap = new Map(S.types.map(t => [normKey(t.name), t]));
  if(pl.newTypes.length){ const made = await dbInsert('training_types', pl.newTypes.map(n => ({ name:n.name, validity_months:Math.max(1, Number(n.months) || 12) }))); made.forEach(t => typeMap.set(normKey(t.name), t)); }
  // 3. шинэ ажилтан
  if(pl.empNew.length){
    const made = await dbInsert('employees', pl.empNew.map(({ row:r }) => ({ emp_code:r.code || null, full_name:r.name, department_id:deptId(r.dept), position:r.pos || null, email:r.email || null, phone:r.phone ? String(r.phone) : null, hired_on:r.hired || null, active:true })));
    made.forEach((e, i) => pl.empNew[i].id = e.id);
  }
  // 4. мэдээлэл шинэчлэх
  for(const u of pl.empUpd){ const p = { ...u.patch }; if(p._dept){ p.department_id = deptId(p._dept); delete p._dept; } if(Object.keys(p).length) await dbUpdate('employees', u.e.id, p); }
  // 5. удирдлагын холбоос
  let links = 0;
  if(pl.mgrLinks.length){
    const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [normKey(e.emp_code), e]));
    const byName = new Map(); S.emps.forEach(e => nameKeys(e.full_name).forEach(k => { if(!byName.has(k)) byName.set(k, []); byName.get(k).push(e); }));
    for(const l of pl.mgrLinks){
      const id = l.who._new ? l.who.id : l.who.id; let m = byCode.get(normKey(l.mgr));
      if(!m){ for(const k of nameKeys(l.mgr)){ const c = byName.get(k) || []; if(c.length === 1){ m = c[0]; break; } } }
      const me = IDX.emp.get(id);
      if(m && me && m.id !== id && me.manager_id !== m.id && !isUnder(m.id, id)){ await dbUpdate('employees', id, { manager_id:m.id }); links++; }
    }
  }
  // 6. сургалтын бичлэг
  const rows = pl.recNew.map(r => ({ employee_id:r.who.id, training_type_id:typeMap.get(r.tk).id, completed_on:r.done, expires_on:r.exp, certificate_no:r.cert, provider:r.prov }));
  if(rows.length) await dbInsert('trainings', rows);
  const summary = { at:new Date().toISOString(), file:im.file, trainings:rows.length, new_emps:pl.empNew.length, updated:pl.empUpd.length, links };
  try{ await saveSettings({ last_import:summary }); } catch(e){ console.warn(e); S.settings.last_import = summary; }
  return summary;
}

  'dl-csv': () => { try{ const b = new Blob(['﻿'+$('#exp-csv').value], { type:'text/csv;charset=utf-8' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = `surgalt-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } catch{ toast('Татаж чадсангүй. Хуулах товчийг ашиглана уу','bad'); } },
  'send-now': async a => { a.disabled = true; const n = await run(sendNow, n => DEMO ? `Демо: ${n} имэйл илгээгдэх байсан` : `${n} сануулга илгээлээ`); a.disabled = false; if(n != null) render(); },
  'del-dept': async a => { const d = IDX.dept.get(Number(a.dataset.id)); const c = S.emps.filter(e => e.department_id === d.id).length; if(!await askConfirm(`"${d.name}" албыг устгах уу?${c?` ${c} ажилтан албагүй болно.`:''}`)) return; await run(async () => { await dbDelete('departments', d.id); render(); }, 'Алба устгагдлаа'); },
  'del-type': async a => { const t = IDX.type.get(Number(a.dataset.id)); const c = S.trs.filter(x => x.training_type_id === t.id).length; if(!await askConfirm(`"${t.name}"-г устгах уу?${c?` Үүнтэй холбоотой ${c} бичлэг мөн устна.`:''}`)) return; await run(async () => { await dbDelete('training_types', t.id); render(); }, 'Устгагдлаа'); },
  'pick-photo': a => { const id = Number(a.dataset.id); const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => setPhoto(id, inp.files[0]); inp.click(); },
  'imp-apply': async a => { a.disabled = true; a.textContent = 'Оруулж байна…';
    const r = await run(applyImport); if(!r){ a.disabled = false; a.textContent = 'Оруулах'; return; }
    S.imp = null; closeModal(); render();
    openModal({ title:'Импорт амжилттай', body:`<p style="margin:0"><b>${r.trainings}</b> сургалтын бичлэг нэмэгдэж, <b>${r.new_emps}</b> шинэ ажилтан, <b>${r.updated}</b> ажилтны мэдээлэл шинэчлэгдлээ${r.links ? `, <b>${r.links}</b> удирдлагын холбоос тохирууллаа` : ''}.</p>${DEMO ? '<p class="note">Демо горим: хуудсыг дахин ачаалахад өөрчлөлт арилна.</p>' : ''}<div class="m-foot"><button class="btn btn-primary" data-act="close">Болсон</button></div>` }); },
  logout: async () => { await sb.auth.signOut(); S.ready = false; S.auth = 'login'; render(); }
};
document.addEventListener('click', ev => { const a = ev.target.closest('[data-act]'); if(!a) return; const f = ACT[a.dataset.act]; if(f){ if(a.tagName === 'A') ev.preventDefault(); f(a, ev); } });
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && $('#modal-root').innerHTML && !$('#confirm-root').innerHTML) closeModal();
  if(ev.key === 'Enter' && ev.target.matches('.drow')) ev.target.click();
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.av-pick')){ ev.preventDefault(); ev.stopPropagation(); ACT['pick-photo'](ev.target); }
});
document.addEventListener('dragover', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(c && ev.dataTransfer?.types.includes('Files')){ ev.preventDefault(); $$('.photo-over').forEach(x => x !== c && x.classList.remove('photo-over')); c.classList.add('photo-over'); } });
document.addEventListener('dragleave', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(c && !c.contains(ev.relatedTarget)) c.classList.remove('photo-over'); });
document.addEventListener('drop', ev => { const c = ev.target.closest?.('[data-photo-drop]'); if(!c) return; ev.preventDefault(); c.classList.remove('photo-over'); setPhoto(Number(c.dataset.photoDrop), ev.dataTransfer.files[0]); });
document.addEventListener('dragover', ev => { const z = ev.target.closest?.('[data-drop]'); if(!z) return; ev.preventDefault(); z.classList.add('over'); });
document.addEventListener('dragleave', ev => { const z = ev.target.closest?.('[data-drop]'); if(z && !z.contains(ev.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest?.('[data-drop]'); if(!z) return; ev.preventDefault(); z.classList.remove('over'); const f = ev.dataTransfer.files[0]; if(f) startImport(f); });
function updBulkCount(){ const n = $$('.pick-list input:checked').length; const c = $('#b-count'); if(c) c.textContent = `${n} сонгосон`; }
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.dataset.filter){ const o = S[t.dataset.filter]; o[t.dataset.key] = t.type === 'checkbox' ? t.checked : t.value; $('#list').innerHTML = t.dataset.filter === 'ef' ? listEmps() : listTrs(); }
  if(t.dataset.bulk){ const q = $('#b-q').value.trim().toLowerCase(), d = $('#b-dept').value; $$('.pick-list label').forEach(l => l.hidden = (d && l.dataset.dept !== d) || (q && !l.dataset.s.includes(q))); }
  const form = t.form;
  if(form && (form.dataset.form === 'training' || form.dataset.form === 'bulk') && (t.name === 'training_type_id' || t.name === 'completed_on') && form.completed_on.value){
    const m = Number(form.training_type_id.selectedOptions[0]?.dataset.m || 12); form.expires_on.value = addMonths(form.completed_on.value, m);
  }
  if(t.name === 'emp') updBulkCount();
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if(t.dataset.photo && t.files[0]){ const id = Number(t.dataset.photo); await run(async () => { await uploadPhoto(id, t.files[0]); refresh(); }, 'Зураг хадгалагдлаа'); }
  if(t.dataset.import && t.files[0]){ const f = t.files[0]; t.value = ''; startImport(f); }
  if(t.dataset.imp && S.imp){
    const k = t.dataset.imp;
    if(k === 'sheet'){ S.imp.si = Number(t.value); S.imp.mode = null; parseCurrent(); }
    if(k === 'mode') S.imp.mode = t.value;
    if(k === 'addNew') S.imp.addNew = t.checked;
    if(k === 'months'){ const v = Number(t.value); if(v > 0) S.imp.months[t.dataset.k] = v; }
    renderImport();
  }
  if(t.dataset.edit){
    const id = Number(t.dataset.id), v = t.value.trim();
    if(t.dataset.edit === 'dept' && v) await run(async () => { await dbUpdate('departments', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-name' && v) await run(async () => { await dbUpdate('training_types', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-months' && Number(v) > 0) await run(async () => { await dbUpdate('training_types', id, { validity_months:Number(v) }); }, 'Хадгалагдлаа. Шинэ бичлэгт хэрэглэгдэнэ');
  }
});
const FORMS = {
  login: async f => { const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.password.value });
    btn.disabled = false; if(error){ const m = error.message || ''; return toast(/confirm/i.test(m) ? 'Имэйл баталгаажаагүй байна. Supabase → Authentication → Users дээр Confirm email хийнэ үү.' : /invalid login|credentials/i.test(m) ? 'Имэйл эсвэл нууц үг буруу байна' : 'Нэвтэрч чадсангүй: ' + m, 'bad'); } S.user = data.user; await start(); },
  emp: async f => {
    const id = num(f.id.value);
    const row = { emp_code:f.emp_code.value.trim()||null, full_name:f.full_name.value.trim(), department_id:num(f.department_id.value), position:f.position.value.trim()||null, email:f.email.value.trim()||null, phone:f.phone.value.trim()||null, active:f.active.checked,
      manager_id:num(f.manager_id.value), hired_on:f.hired_on.value||null, notes:f.notes.value.trim()||null };
    if(id && row.manager_id && (row.manager_id === id || isUnder(row.manager_id, id))) return toast('Өөрийн доод ажилтныг удирдлага болгож болохгүй','bad');
    const r = await run(() => id ? dbUpdate('employees', id, row) : dbInsert('employees', row), id ? 'Хадгалагдлаа' : 'Ажилтан нэмэгдлээ');
    if(r){ render(); openProfile(r.id); }
  },
  training: async f => {
    const id = num(f.id.value), emp = Number(f.employee_id.value);
    if(f.expires_on.value < f.completed_on.value) return toast('Дуусах огноо хамрагдсан огнооноос өмнө байна','bad');
    const row = { employee_id:emp, training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, certificate_no:f.certificate_no.value.trim()||null, provider:f.provider.value.trim()||null, notes:f.notes.value.trim()||null };
    const r = await run(() => id ? dbUpdate('trainings', id, row) : dbInsert('trainings', row), 'Сургалт хадгалагдлаа');
    if(r){ render(); openProfile(emp); }
  },
  bulk: async f => {
    const ids = $$('input[name=emp]:checked', f).map(i => Number(i.value)); if(!ids.length) return toast('Ажилтан сонгоно уу','bad');
    const base = { training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, provider:f.provider.value.trim()||null };
    const r = await run(() => dbInsert('trainings', ids.map(e => ({ ...base, employee_id:e }))), `${ids.length} ажилтанд бүртгэлээ`);
    if(r){ closeModal(); render(); }
  },
  settings: async f => {
    const days = [...new Set(f.days.value.split(/[,\s]+/).map(Number).filter(n => Number.isInteger(n) && n >= 0))].sort((a,b) => b-a);
    if(!days.length) return toast('Дор хаяж нэг хоног оруулна уу','bad');
    const r = await run(() => saveSettings({ reminder_days:days, hr_email:f.hr_email.value.trim()||null, from_email:f.from_email.value.trim(), company_name:f.company_name.value.trim() }), 'Тохиргоо хадгалагдлаа');
    render();
  },
  'add-dept': async f => { const n = f.name.value.trim(); await run(async () => { await dbInsert('departments', { name:n, sort:S.depts.length+1 }); render(); }, 'Алба нэмэгдлээ'); },
  'add-type': async f => { const n = f.name.value.trim(), m = Number(f.months.value)||12; await run(async () => { await dbInsert('training_types', { name:n, validity_months:m }); render(); }, 'Сургалт нэмэгдлээ'); }
};
document.addEventListener('submit', ev => { const f = ev.target; if(!f.dataset.form) return; ev.preventDefault(); FORMS[f.dataset.form]?.(f); });

/* ---------- boot ---------- */
async function start(){
  S.ready = false; S.auth = null; render();
  try{ await loadAll(); reindex(); S.ready = true; render(); }
  catch(e){ console.error(e); $('#app').innerHTML = `<div class="login"><div class="panel"><div class="panel-body"><h2 style="font-size:16px">Өгөгдөл ачаалж чадсангүй</h2><p class="muted">${esc(e.message||e)}</p><p class="note">setup.sql-ийг Supabase дээр ажиллуулсан эсэх, CONFIG дахь URL, түлхүүр зөв эсэхийг шалгана уу.</p></div></div></div>`; }
}
async function boot(){
  if(DEMO) return start();
  if(!sb){ $('#app').innerHTML = '<div class="login"><p>Supabase сан ачаалагдсангүй. Интернэт холболтоо шалгана уу.</p></div>'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ S.auth = 'login'; render(); return; }
  S.user = session.user; start();
}
boot();
</script>
</body>
</html>
