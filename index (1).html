<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сургалтын Бүртгэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: fixed left rail of sections + one working column; collapses to a top tab bar on phones */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eceff5; --line:#d9dee8; --line-2:#e8ebf2;
  --fg:#172033; --muted:#5a6479; --faint:#8a93a6;
  --accent:#1c4e8f; --accent-hover:#163f75; --accent-fg:#ffffff; --accent-soft:#e2eaf6;
  --ok:#1d7347; --ok-soft:#dff1e6; --warn:#9a5800; --warn-soft:#fcecd2;
  --bad:#b0242b; --bad-soft:#fbe1e1; --none:#6b7385; --none-soft:#eceef2;
  --av-l:86%; --av-fl:30%;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.10);
  --ovl:rgba(15,22,36,.45);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171d28; --surface-2:#1f2634; --line:#2b3445; --line-2:#232b3a;
  --fg:#e6eaf2; --muted:#9ba5b8; --faint:#6f7a8f;
  --accent:#86aee8; --accent-hover:#a3c3f0; --accent-fg:#0d1522; --accent-soft:#1c2a40;
  --ok:#62d096; --ok-soft:#163126; --warn:#f1b54e; --warn-soft:#3a2a10;
  --bad:#f4807f; --bad-soft:#3e1b1e; --none:#9ba5b8; --none-soft:#242b38;
  --av-l:30%; --av-fl:85%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --ovl:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{flex:none}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:861px){.main{padding-left:32px;padding-right:32px}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand div{display:none}
  .nav{flex-direction:row}
  .nav button span.lbl{font-size:13px}
  .side-foot{display:none}
}

.demo-bar{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.demo-bar b{font-weight:600}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--bad)}
.btn-danger:hover{border-color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-s{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;flex:1 1 160px}
.toolbar .search{flex:2 1 220px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h2{font-size:15px;font-weight:600}
.panel-body{padding:16px 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.tile:hover{border-color:var(--faint)}
.tile .t-lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .t-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tile .t-sub{font-size:12px;color:var(--faint)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,transparent)}
.tile.ok{--tc:var(--ok)} .tile.warn{--tc:var(--warn)} .tile.bad{--tc:var(--bad)}
.tile.warn .t-num{color:var(--warn)} .tile.bad .t-num{color:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-none{background:var(--none-soft);color:var(--none)}
.chip-plain{background:var(--surface-2);color:var(--muted)}
.chip-plain::before{display:none}

/* avatar */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--surface-2)}
.av-ini{background:hsl(var(--h) 42% var(--av-l));color:hsl(var(--h) 45% var(--av-fl));font-weight:600}
.av-sm{width:30px;height:30px;font-size:11px}
.av-md{width:40px;height:40px;font-size:14px}
.av-lg{width:56px;height:56px;font-size:18px}
.av-xl{width:112px;height:112px;font-size:34px}

/* dept bars */
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) 56px minmax(0,1.5fr) 46px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover .dname{color:var(--accent)}
.dname{font-weight:500;min-width:0;overflow-wrap:anywhere}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-bad{background:var(--bad)}
.pct{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* people rows */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow:hover .p-name{color:var(--accent)}
.p-name{font-weight:500;overflow-wrap:anywhere}
.p-sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.p-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* employee cards */
.count{margin:0 0 10px;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;text-align:left;cursor:pointer;align-items:start}
.ecard:hover{border-color:var(--accent)}
.ecard .e-name{font-weight:600;overflow-wrap:anywhere}
.ecard .e-pos{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ecard .e-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;display:block}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)}
.ecard.inactive{opacity:.6}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .who{display:flex;gap:10px;align-items:center;min-width:180px}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tr.old td{color:var(--faint)}

/* modal / drawer */
.ovl{position:fixed;inset:0;background:var(--ovl);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:560px;margin-top:4vh}
.modal.wide{max-width:820px}
.ovl.is-drawer{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--surface);width:100%;max-width:640px;min-height:100%;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);gap:10px}
.m-head h2{font-size:16px;font-weight:600}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
#confirm-root .ovl{z-index:60}

.prof-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:520px){.prof-top{grid-template-columns:1fr}}
.prof-photo{display:flex;flex-direction:column;gap:10px;align-items:center}
.prof-top h3{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 0;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h4{font-size:14px;font-weight:600}
.tr-card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.tr-card .tr-name{font-weight:600}
.tr-card .tr-meta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.tr-card .tr-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tr-list{display:flex;flex-direction:column;gap:8px}
details.hist summary{cursor:pointer;color:var(--muted);font-size:13px}

.pick-list{border:1px solid var(--line);border-radius:8px;max-height:320px;overflow-y:auto}
.pick-list label{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pick-list label:last-child{border-bottom:0}
.pick-list label:hover{background:var(--surface-2)}

.set-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;padding:6px 0}
.set-row.two{grid-template-columns:minmax(0,1fr) auto}
.days-chips{display:flex;gap:6px;flex-wrap:wrap}
pre.code{background:var(--surface-2);border-radius:7px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;overflow-x:auto;margin:0;white-space:pre}
.mail{border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:13.5px}
.mail-h{background:var(--surface-2);padding:10px 14px;font-size:12.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.mail-h span{color:var(--muted)}
.mail-b{padding:14px;display:flex;flex-direction:column;gap:8px}
.mail-b p{margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}

.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login .panel{width:100%;max-width:380px}

#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px}
.toast.bad{background:var(--bad);color:#fff}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
</style>
</head>
<body>

<div id="app"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ============================================================
   ТОХИРГОО — Supabase-ийн мэдээллээ энд оруулна.
   Хоосон байвал апп ДЕМО горимоор (жишээ өгөгдөлтэй) ажиллана.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: '',       // жишээ: https://abcdxyz.supabase.co
  SUPABASE_ANON_KEY: ''   // Project Settings → API → anon public key
};

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const TABLES = { departments:'depts', employees:'emps', training_types:'types', trainings:'trs', reminder_log:'logs' };
const S = {
  ready:false, auth:null, user:null, view:'dash',
  depts:[], emps:[], types:[], trs:[], logs:[],
  settings:{ reminder_days:[30,14,7,1,0], hr_email:'', from_email:'Сургалт <noreply@otpclicenses.mn>', company_name:'Манай байгууллага' },
  ef:{ q:'', dept:'', status:'', inactive:false },
  tf:{ q:'', dept:'', type:'', status:'' },
  openEmp:null
};
let IDX = {}; let DEMO_ID = 0;

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysUntil = s => Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000);
function addMonths(s, n){ const d=parseYmd(s), day=d.getDate(); const t=new Date(d.getFullYear(), d.getMonth()+n, 1); const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); }
function addDays(s, n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const fmtDate = s => s ? s.replaceAll('-', '.') : '—';
const num = v => v === '' || v == null ? null : Number(v);
function normDate(v){
  v = String(v||'').trim(); if(!v) return null;
  let m = v.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = v.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;

}

const warnDays = () => { const d = S.settings.reminder_days || []; return d.length ? Math.max(...d) : 30; };
const statusOf = d => d < 0 ? 'bad' : d <= warnDays() ? 'warn' : 'ok';
const ST = { ok:'Хүчинтэй', warn:'Дуусах дөхсөн', bad:'Хугацаа дууссан', none:'Сургалтгүй' };

function reindex(){
  IDX.dept = new Map(S.depts.map(d => [d.id, d]));
  IDX.emp  = new Map(S.emps.map(e => [e.id, e]));
  IDX.type = new Map(S.types.map(t => [t.id, t]));
  const cur = new Map();
  for(const t of S.trs){
    const k = t.employee_id+':'+t.training_type_id, p = cur.get(k);
    if(!p || t.expires_on > p.expires_on || (t.expires_on === p.expires_on && t.id > p.id)) cur.set(k, t);
  }
  IDX.currentIds = new Set();
  IDX.current = [...cur.values()].filter(t => IDX.emp.has(t.employee_id) && IDX.type.has(t.training_type_id)).map(t => {
    IDX.currentIds.add(t.id); const days = daysUntil(t.expires_on); return { ...t, days, status: statusOf(days) };
  });
  IDX.byEmp = new Map();
  for(const c of IDX.current){ if(!IDX.byEmp.has(c.employee_id)) IDX.byEmp.set(c.employee_id, []); IDX.byEmp.get(c.employee_id).push(c); }
}
function empStatus(id){ const l = IDX.byEmp.get(id) || []; if(!l.length) return 'none'; if(l.some(c=>c.status==='bad')) return 'bad'; if(l.some(c=>c.status==='warn')) return 'warn'; return 'ok'; }
const activeCurrent = () => IDX.current.filter(c => IDX.emp.get(c.employee_id).active);
const deptName = id => IDX.dept.get(id)?.name || '—';
const typeName = id => IDX.type.get(id)?.name || '—';
const sortedDepts = () => [...S.depts].sort((a,b) => (a.sort??0)-(b.sort??0) || a.name.localeCompare(b.name,'mn'));
const sortedTypes = () => [...S.types].sort((a,b) => a.name.localeCompare(b.name,'mn'));

function pendingReminders(){
  const days = [...(S.settings.reminder_days||[])].sort((a,b)=>a-b);
  const out = [];
  for(const c of activeCurrent()){
    if(c.days < 0) continue;
    const b = days.find(d => d >= c.days); if(b == null) continue;
    if(S.logs.some(l => l.training_id === c.id && l.days_before === b)) continue;
    out.push({ ...c, bucket:b });
  }
  return out.sort((a,b)=>a.days-b.days);
}

function initials(n){ const p = String(n||'').replace(/^[А-ЯӨҮЁA-Z]\.\s*/u,'').trim().split(/\s+/); return (p[0]||'?').slice(0,2).toUpperCase(); }

async function fetchAll(table){
  const out = []; const step = 1000;
  for(let from=0;;from+=step){
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from+step-1);
    if(error) throw error; out.push(...data); if(data.length < step) break;
  }
  return out;
}
async function loadAll(){
  if(DEMO){ seedDemo(); return; }
  const [d,e,t,tr] = await Promise.all(['departments','employees','training_types','trainings'].map(fetchAll));
  const l = await sb.from('reminder_log').select('*').order('sent_at',{ascending:false}).limit(2000);
  const s = await sb.from('settings').select('*').eq('id',1).maybeSingle();
  if(l.error) throw l.error; if(s.error) throw s.error;
  Object.assign(S, { depts:d, emps:e, types:t, trs:tr, logs:l.data });
  if(s.data) S.settings = s.data;
}
async function dbInsert(table, rows){
  const arr = Array.isArray(rows) ? rows : [rows]; let out = [];
  if(DEMO){ out = arr.map(r => ({ ...r, id: ++DEMO_ID, created_at: new Date().toISOString() })); }
  else for(let i=0;i<arr.length;i+=500){ const { data, error } = await sb.from(table).insert(arr.slice(i,i+500)).select(); if(error) throw error; out.push(...data); }
  S[TABLES[table]].push(...out); reindex();
  return Array.isArray(rows) ? out : out[0];
}
async function dbUpdate(table, id, patch){
  const list = S[TABLES[table]]; const i = list.findIndex(x => x.id === id); let row;
  if(DEMO) row = { ...list[i], ...patch };
  else { const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single(); if(error) throw error; row = data; }
  if(i >= 0) list[i] = row; reindex(); return row;
}
async function dbDelete(table, id){
  if(!DEMO){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }
  const k = TABLES[table]; S[k] = S[k].filter(x => x.id !== id);
  if(table === 'employees') S.trs = S.trs.filter(t => t.employee_id !== id);
  if(table === 'training_types') S.trs = S.trs.filter(t => t.training_type_id !== id);
  if(table === 'departments') S.emps.forEach(e => { if(e.department_id === id) e.department_id = null; });
  if(table === 'trainings') S.logs = S.logs.filter(l => l.training_id !== id);
  reindex();
}
async function saveSettings(patch){
  if(DEMO) Object.assign(S.settings, patch);
  else { const { data, error } = await sb.from('settings').update({ ...patch, updated_at:new Date().toISOString() }).eq('id',1).select().single(); if(error) throw error; S.settings = data; }
  reindex();
}
async function sendNow(){
  if(DEMO){
    const p = pendingReminders(); const now = new Date().toISOString();
    for(const x of p){ const e = IDX.emp.get(x.employee_id); S.logs.unshift({ id:++DEMO_ID, training_id:x.id, days_before:x.bucket, recipients:JSON.stringify([e.email, S.settings.hr_email].filter(Boolean)), sent_at:now }); }
    return p.length;
  }
  const { data, error } = await sb.rpc('send_training_reminders'); if(error) throw error;
  const l = await sb.from('reminder_log').select('*').order('sent_at',{ascending:false}).limit(2000);
  if(!l.error) S.logs = l.data;
  return data;
}
function resizeImage(file, size=360){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height); const ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob:b, dataUrl:c.toDataURL('image/jpeg', .85) }) : rej(new Error('Зураг уншиж чадсангүй')), 'image/jpeg', .85);
    };
    img.onerror = () => rej(new Error('Зургийн формат танигдсангүй'));
    img.src = url;
  });
}
async function uploadPhoto(empId, file){
  const { blob, dataUrl } = await resizeImage(file);
  if(DEMO) return dbUpdate('employees', empId, { photo_url:dataUrl });
  const path = `emp-${empId}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:true });
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return dbUpdate('employees', empId, { photo_url:data.publicUrl });
}

  }).join('');
  const up = cur.filter(c => c.days >= 0 && c.days <= 60).sort((a,b) => a.days - b.days);
  const od = cur.filter(c => c.days < 0).sort((a,b) => a.days - b.days);
  return `
  <div class="page-head"><div><h1>Хянах самбар</h1><p>${fmtDate(todayStr())} байдлаар · ${act.length} идэвхтэй ажилтан, ${S.depts.length} алба</p></div>

    ${tile('warn',`${warnDays()} хоногт дуусах`, n.warn, 'Сануулга илгээгдэнэ', 'warn')}
    ${tile('bad','Хугацаа дууссан', n.bad, 'Давтан сургалт шаардлагатай', 'bad')}
    ${tile('','Сургалтгүй ажилтан', none, 'Нэг ч бүртгэлгүй', '')}
  </div>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>Албадын гүйцэтгэл</h2><div class="legend"><span><i class="b-ok" style="background:var(--ok)"></i>Хүчинтэй</span><span><i style="background:var(--warn)"></i>Дөхсөн</span><span><i style="background:var(--bad)"></i>Дууссан</span></div></div>
      <div class="panel-body" style="padding-block:6px">${rows || '<div class="empty">Алба бүртгэгдээгүй байна.</div>'}</div></section>
    <section class="panel"><div class="panel-head"><h2>Ойрын 60 хоногт дуусах</h2><span class="chip chip-plain">${up.length}</span></div>
      <div class="panel-body" style="padding-block:4px">${up.length ? up.slice(0,10).map(personRow).join('') + (up.length>10?`<div style="padding:10px 0"><button class="btn-link" data-act="goto-trs" data-st="warn">Бүгдийг харах →</button></div>`:'') : '<div class="empty">Ойрын хугацаанд дуусах сургалт алга.</div>'}</div></section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Хугацаа дууссан</h2><button class="btn btn-sm" data-act="goto-trs" data-st="bad">Жагсаалт руу</button></div>
    <div class="panel-body" style="padding-block:4px">${od.length ? `<div class="cols" style="gap:0 28px">${[od.slice(0,10).filter((_,i)=>i%2===0), od.slice(0,10).filter((_,i)=>i%2===1)].map(c => `<div>${c.map(personRow).join('')}</div>`).join('')}</div>` : '<div class="empty">Хугацаа дууссан сургалт алга. Сайн байна.</div>'}</div></section>`;

function filteredTrs(){
  const f = S.tf, q = f.q.trim().toLowerCase();
  return activeCurrent().filter(c => {
    const e = IDX.emp.get(c.employee_id);
    if(f.dept && String(e.department_id) !== String(f.dept)) return false;
    if(f.type && String(c.training_type_id) !== String(f.type)) return false;
    if(f.status && c.status !== f.status) return false;
    if(q && !(e.full_name+' '+(e.emp_code||'')+' '+(c.certificate_no||'')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => a.days - b.days);
}

  const l = filteredTrs();

}

function openModal({ title, body, wide=false, drawer=false }){
  $('#modal-root').innerHTML = `<div class="ovl ${drawer?'is-drawer':''}" data-act="ovl"><div class="${drawer?'drawer':'modal'+(wide?' wide':'')}" role="dialog" aria-modal="true" aria-label="${esc(title)}">

  const first = $('#modal-root .m-body input:not([type=hidden]):not([type=file]), #modal-root .m-body select'); if(first && !drawer) first.focus();
}
function closeModal(){ $('#modal-root').innerHTML = ''; S.openEmp = null; }
function askConfirm(msg, okLabel='Устгах'){
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="ovl"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:420px"><div class="m-body"><p style="margin:0">${esc(msg)}</p>
      <div class="m-foot"><button class="btn" data-c="0">Болих</button><button class="btn btn-primary" data-c="1">${esc(okLabel)}</button></div></div></div></div>`;
    root.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { root.innerHTML = ''; res(b.dataset.c === '1'); });
    root.querySelector('[data-c="1"]').focus();
  });
}

function profileBody(id){
  const e = IDX.emp.get(id); if(!e) return '<div class="empty">Ажилтан олдсонгүй.</div>';
  const cur = (IDX.byEmp.get(id)||[]).sort((a,b) => a.days - b.days);
  const old = S.trs.filter(t => t.employee_id === id && !IDX.currentIds.has(t.id)).sort((a,b) => b.expires_on.localeCompare(a.expires_on));
  return `<div class="prof-top"><div class="prof-photo">${avatar(e,'xl')}<label class="btn btn-sm">Зураг ${e.photo_url?'солих':'оруулах'}<input type="file" accept="image/*" data-photo="${id}" hidden></label></div>
    <div style="min-width:0"><h3>${esc(e.full_name)}</h3><p class="muted" style="margin:2px 0 0">${esc(e.position||'—')} · ${esc(deptName(e.department_id))}</p>

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0];
  const delim = [';','\t',','].map(d => [d, first.split(d).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
const csvCell = v => { v = String(v ?? ''); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
async function importEmps(text){
  const rows = parseCSV(text).slice(1); let add = 0, upd = 0; const errs = [];
  const byName = new Map(S.depts.map(d => [d.name.toLowerCase(), d]));
  const newDepts = [...new Set(rows.map(r => r[2]).filter(n => n && !byName.has(n.toLowerCase())))];
  if(newDepts.length){ const made = await dbInsert('departments', newDepts.map((n,i) => ({ name:n, sort:S.depts.length+i+1 }))); made.forEach(d => byName.set(d.name.toLowerCase(), d)); }
  const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [e.emp_code.toLowerCase(), e]));
  const inserts = [];
  for(const [i, r] of rows.entries()){
    const [code, name, dept, pos, email, phone] = r;
    if(!name){ errs.push(`${i+2}-р мөр: нэр хоосон`); continue; }
    const row = { emp_code:code||null, full_name:name, department_id: dept ? byName.get(dept.toLowerCase())?.id ?? null : null, position:pos||null, email:email||null, phone:phone||null };
    const ex = code && byCode.get(code.toLowerCase());
    if(ex){ await dbUpdate('employees', ex.id, row); upd++; } else { inserts.push({ ...row, active:true }); }
  }
  if(inserts.length){ await dbInsert('employees', inserts); add = inserts.length; }
  return { add, upd, errs };
}
async function importTrs(text){
  const rows = parseCSV(text).slice(1); const errs = [];
  const byCode = new Map(S.emps.filter(e => e.emp_code).map(e => [e.emp_code.toLowerCase(), e]));
  const byType = new Map(S.types.map(t => [t.name.toLowerCase(), t]));
  const newTypes = [...new Set(rows.map(r => r[1]).filter(n => n && !byType.has(n.toLowerCase())))];
  if(newTypes.length){ const made = await dbInsert('training_types', newTypes.map(n => ({ name:n, validity_months:12 }))); made.forEach(t => byType.set(t.name.toLowerCase(), t)); }
  const ins = [];
  for(const [i, r] of rows.entries()){
    const [code, tname, date, cert, prov] = r; const ln = i+2;
    const e = code && byCode.get(code.toLowerCase()); if(!e){ errs.push(`${ln}-р мөр: "${code}" кодтой ажилтан алга`); continue; }
    const t = tname && byType.get(tname.toLowerCase()); if(!t){ errs.push(`${ln}-р мөр: сургалтын нэр хоосон`); continue; }
    const d = normDate(date); if(!d){ errs.push(`${ln}-р мөр: огноо "${date}" буруу`); continue; }
    ins.push({ employee_id:e.id, training_type_id:t.id, completed_on:d, expires_on:addMonths(d, t.validity_months), certificate_no:cert||null, provider:prov||null });
  }
  if(ins.length) await dbInsert('trainings', ins);
  return { add:ins.length, upd:0, errs, newTypes };
}

function exportCSV(){
  const head = ['Код','Овог нэр','Алба','Албан тушаал','Имэйл','Сургалт','Хамрагдсан','Дуусах','Үлдсэн хоног','Төлөв','Гэрчилгээ №','Байгууллага'];
  const rows = filteredTrs().map(c => { const e = IDX.emp.get(c.employee_id); return [e.emp_code, e.full_name, deptName(e.department_id), e.position, e.email, typeName(c.training_type_id), c.completed_on, c.expires_on, c.days, ST[c.status], c.certificate_no, c.provider]; });
  const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
  openModal({ title:'CSV экспорт', wide:true, body:`<p class="note" style="margin:0">${rows.length} мөр. Татах товч ажиллахгүй бол хуулж аваад Excel-д буулгана уу.</p>

    <div class="m-foot"><button class="btn" data-act="copy-csv">Хуулах</button><button class="btn btn-primary" data-act="dl-csv">Татах (.csv)</button></div>` });
}

    if(t.dataset.edit === 'dept' && v) await run(async () => { await dbUpdate('departments', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-name' && v) await run(async () => { await dbUpdate('training_types', id, { name:v }); }, 'Хадгалагдлаа');
    if(t.dataset.edit === 'type-months' && Number(v) > 0) await run(async () => { await dbUpdate('training_types', id, { validity_months:Number(v) }); }, 'Хадгалагдлаа. Шинэ бичлэгт хэрэглэгдэнэ');
  }
});
const FORMS = {
  login: async f => { const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.password.value });
    btn.disabled = false; if(error) return toast('Имэйл эсвэл нууц үг буруу байна','bad'); S.user = data.user; await start(); },
  emp: async f => {
    const id = num(f.id.value);
    const row = { emp_code:f.emp_code.value.trim()||null, full_name:f.full_name.value.trim(), department_id:num(f.department_id.value), position:f.position.value.trim()||null, email:f.email.value.trim()||null, phone:f.phone.value.trim()||null, active:f.active.checked };
    const r = await run(() => id ? dbUpdate('employees', id, row) : dbInsert('employees', row), id ? 'Хадгалагдлаа' : 'Ажилтан нэмэгдлээ');
    if(r){ render(); openProfile(r.id); }
  },
  training: async f => {
    const id = num(f.id.value), emp = Number(f.employee_id.value);
    if(f.expires_on.value < f.completed_on.value) return toast('Дуусах огноо хамрагдсан огнооноос өмнө байна','bad');
    const row = { employee_id:emp, training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, certificate_no:f.certificate_no.value.trim()||null, provider:f.provider.value.trim()||null, notes:f.notes.value.trim()||null };
    const r = await run(() => id ? dbUpdate('trainings', id, row) : dbInsert('trainings', row), 'Сургалт хадгалагдлаа');
    if(r){ render(); openProfile(emp); }
  },
  bulk: async f => {
    const ids = $$('input[name=emp]:checked', f).map(i => Number(i.value)); if(!ids.length) return toast('Ажилтан сонгоно уу','bad');
    const base = { training_type_id:Number(f.training_type_id.value), completed_on:f.completed_on.value, expires_on:f.expires_on.value, provider:f.provider.value.trim()||null };
    const r = await run(() => dbInsert('trainings', ids.map(e => ({ ...base, employee_id:e }))), `${ids.length} ажилтанд бүртгэлээ`);
    if(r){ closeModal(); render(); }
  },
  settings: async f => {
    const days = [...new Set(f.days.value.split(/[,\s]+/).map(Number).filter(n => Number.isInteger(n) && n >= 0))].sort((a,b) => b-a);
    if(!days.length) return toast('Дор хаяж нэг хоног оруулна уу','bad');
    const r = await run(() => saveSettings({ reminder_days:days, hr_email:f.hr_email.value.trim()||null, from_email:f.from_email.value.trim(), company_name:f.company_name.value.trim() }), 'Тохиргоо хадгалагдлаа');
    render();
  },
  'add-dept': async f => { const n = f.name.value.trim(); await run(async () => { await dbInsert('departments', { name:n, sort:S.depts.length+1 }); render(); }, 'Алба нэмэгдлээ'); },
  'add-type': async f => { const n = f.name.value.trim(), m = Number(f.months.value)||12; await run(async () => { await dbInsert('training_types', { name:n, validity_months:m }); render(); }, 'Сургалт нэмэгдлээ'); }
};
document.addEventListener('submit', ev => { const f = ev.target; if(!f.dataset.form) return; ev.preventDefault(); FORMS[f.dataset.form]?.(f); });

/* ---------- boot ---------- */
async function start(){
  S.ready = false; S.auth = null; render();
  try{ await loadAll(); reindex(); S.ready = true; render(); }
  catch(e){ console.error(e); $('#app').innerHTML = `<div class="login"><div class="panel"><div class="panel-body"><h2 style="font-size:16px">Өгөгдөл ачаалж чадсангүй</h2><p class="muted">${esc(e.message||e)}</p><p class="note">setup.sql-ийг Supabase дээр ажиллуулсан эсэх, CONFIG дахь URL, түлхүүр зөв эсэхийг шалгана уу.</p></div></div></div>`; }
}
async function boot(){
  if(DEMO) return start();
  if(!sb){ $('#app').innerHTML = '<div class="login"><p>Supabase сан ачаалагдсангүй. Интернэт холболтоо шалгана уу.</p></div>'; return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ S.auth = 'login'; render(); return; }
  S.user = session.user; start();
}
boot();
</script>
</body>
